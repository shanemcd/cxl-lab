---
# Full pipeline: host prep → artifacts (SRPM + QEMU) → network → OS image
# (kernel build + layered image + registry) → ignition → VMs → install → MCO.
# The numeric prefixes ARE the import order. Stages can be run individually
# via the numbered playbooks. Verification, teardown, and ops run explicitly.
- name: Host preparation stage
  import_playbook: 01_host_prep.yml
- name: Artifact construction stage (SRPM, host QEMU)
  import_playbook: 02_artifacts.yml
- name: Lab network stage
  import_playbook: 03_network.yml
- name: Layered OS image and registry stage
  import_playbook: 04_os_image.yml
- name: Install config and ignition stage
  import_playbook: 05_ignition.yml
- name: Virtual machines stage
  import_playbook: 06_vms.yml
- name: Cluster install stage
  import_playbook: 07_install.yml
- name: MCO and region commit stage
  import_playbook: 08_mco.yml
- name: Verification stage
  import_playbook: verify.yml
