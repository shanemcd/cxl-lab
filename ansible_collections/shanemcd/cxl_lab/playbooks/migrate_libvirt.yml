---
# Adopt an existing, STOPPED raw-QEMU lab without reinstalling OpenShift.
# Original workspace disks remain untouched as rollback sources; after
# adoption the copies in libvirt_runtime_dir are the authoritative disks.
- name: Adopt the stopped lab into persistent libvirt domains
  hosts: all
  become: true
  gather_facts: true
  pre_tasks:
    - ansible.builtin.import_role:
        name: shanemcd.cxl_lab.workspace
  tasks:
    - name: Adopt and start the existing lab
      block:
        - ansible.builtin.import_role:
            name: shanemcd.cxl_lab.workspace
            tasks_from: reconcile
        - name: Refuse to copy disks still opened by raw QEMU
          ansible.builtin.command:
            argv: [fuser, -s, "{{ vm_images_dir }}/{{ item.name }}.qcow2"]
          loop: "{{ masters + cxl_workers + dram_workers }}"
          register: migration_disk_users
          changed_when: false
          failed_when: migration_disk_users.rc != 1
        - ansible.builtin.import_role:
            name: shanemcd.cxl_lab.network
        - ansible.builtin.import_role:
            name: shanemcd.cxl_lab.vms
      always:
        - ansible.builtin.import_role:
            name: shanemcd.cxl_lab.workspace
            tasks_from: reconcile
