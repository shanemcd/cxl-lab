---
- name: Lab network (bridge, podman-managed NAT, host resolution)
  hosts: all
  become: true
  gather_facts: true
  pre_tasks:
    - ansible.builtin.import_role:
        name: shanemcd.cxl_lab.workspace
  tasks:
    - name: Run stage with user-owned workspace artifacts
      block:
        - ansible.builtin.import_role:
            name: shanemcd.cxl_lab.workspace
            tasks_from: reconcile
        - ansible.builtin.import_role:
            name: shanemcd.cxl_lab.network
      always:
        - ansible.builtin.import_role:
            name: shanemcd.cxl_lab.workspace
            tasks_from: reconcile
