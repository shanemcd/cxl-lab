---
- name: Verify the live CXL lab
  hosts: all
  become: true
  gather_facts: false

  pre_tasks:
    - ansible.builtin.import_role:
        name: shanemcd.cxl_lab.workspace

  tasks:
    - ansible.builtin.import_role:
        name: shanemcd.cxl_lab.verify

  post_tasks:
    - ansible.builtin.import_role:
        name: shanemcd.cxl_lab.workspace
        tasks_from: handback
