---
# Metadata-only migration: no cluster calls, VM actions, builds or restarts.
- name: Repair existing lab workspace ownership
  hosts: all
  become: true
  gather_facts: false
  roles:
    - role: shanemcd.cxl_lab.workspace
  tasks:
    - name: Repair existing artifacts without reprovisioning
      ansible.builtin.import_role:
        name: shanemcd.cxl_lab.workspace
        tasks_from: reconcile
