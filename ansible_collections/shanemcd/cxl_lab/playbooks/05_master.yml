---
- name: Master VM phase — start the master and drive its install
  hosts: all
  become: true
  gather_facts: false
  pre_tasks:
    # Collect a QEMU build launched by the artifacts play (fresh-host path):
    # wait for the builder container, install the staged tree, validate the
    # binary — before the vms role resolves the QEMU the fleet will run on.
    # A no-op when nothing is in flight (warm path — the artifacts play
    # already validated the installed binary).
    - name: Collect the in-flight QEMU build, if any
      ansible.builtin.include_role:
        name: shanemcd.cxl_lab.qemu_builder
        tasks_from: collect
      when: qemu_builder_build_in_flight | default(false)
  tasks:
    - name: Run the vms master phase
      ansible.builtin.include_role:
        name: shanemcd.cxl_lab.vms
        tasks_from: master
