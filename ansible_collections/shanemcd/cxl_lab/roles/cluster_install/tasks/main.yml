---
# cluster_install: by the time this role runs the bootstrap-in-place
# install is already underway — the master installed itself and the
# workers fetched fresh ignition from the installed master's MCS. This
# role drives the cluster to a converged single-node state: heals the
# machine-os-puller pivot race (if present), approves kubelet CSRs until
# every worker is Ready, keeps masters schedulable (SNO — asserted, never
# changed), pins the ingress router to the master (stable *.apps hosts
# entries across worker restarts), and asserts the
# final state: all nodes Ready, clusteroperators Available, clusterversion
# Available, master's booted osimage == the pinned payload
# machine-os-content. No stamps: every step is naturally idempotent.

- name: Stat the cluster auth artifacts
  ansible.builtin.stat:
    path: "{{ kubeconfig_path }}"
  register: cluster_install_kubeconfig_stat

- name: Assert the cluster auth artifacts exist
  ansible.builtin.assert:
    that:
      - cluster_install_kubeconfig_stat.stat.exists
    fail_msg: >-
      {{ kubeconfig_path }} missing — run 04_ignition.yml (the installer
      writes the auth artifacts with the BiP ignition).

- name: Read node statuses
  ansible.builtin.command:
    argv:
      - bash
      - "{{ vm_scripts_dir }}/run-{{ item.name }}.sh"
      - --status
  loop: "{{ masters + cxl_workers + dram_workers }}"
  loop_control:
    label: "{{ item.name }}"
  register: cluster_install_vm_status
  changed_when: false
  failed_when: false

- name: Assert all node VMs run
  ansible.builtin.assert:
    that:
      - item.rc == 0
    fail_msg: >-
      {{ item.item.name }} is not running (rc={{ item.rc }}) — run
      07_workers.yml first.
  loop: "{{ cluster_install_vm_status.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Wait for the installed API server to be ready
  # First cluster touch: right after the BiP install settles, the API
  # server can still be warming up and time out individual requests
  # (observed live: a plain `oc get sa` failing with a 60s server-side
  # Timeout). Poll readyz the same way layered_image does before its
  # first cluster interaction.
  ansible.builtin.command:
    argv:
      - "{{ install_bin_dir }}/oc"
      - get
      - "--raw=/readyz"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: cluster_install_api_ready
  until: cluster_install_api_ready.rc == 0
  retries: "{{ cluster_install_api_ready_retries }}"
  delay: "{{ cluster_install_api_ready_delay_seconds }}"
  changed_when: false

- name: Read the machine-os-puller SA registry-secret annotation
  # BiP pivot race (observed live, 4.22.16): the SA gets
  # internal-registry-pull-secret-ref pointing at a dockercfg secret the
  # openshift-controller-manager never created (it restarted across the
  # live-env → installed transition); the machine-config operator then
  # fails every resync on the missing secret. Dropping the stale
  # annotation lets the resync complete — the annotation is optional.
  # Retried: the single-node API can briefly time out under the join-phase
  # load peak (workers pivoting + kubelets registering) — observed live.
  ansible.builtin.command:
    argv:
      - "{{ install_bin_dir }}/oc"
      - get
      - sa
      - "{{ cluster_install_mos_puller_sa }}"
      - "-n"
      - "{{ cluster_install_mco_namespace }}"
      - "-o"
      - "jsonpath={.metadata.annotations.openshift\\.io/internal-registry-pull-secret-ref}"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: cluster_install_mos_puller_annotation
  until: cluster_install_mos_puller_annotation.rc == 0
  retries: "{{ cluster_install_api_ready_retries }}"
  delay: "{{ cluster_install_api_ready_delay_seconds }}"
  changed_when: false

- name: Drop the stale machine-os-puller registry-secret annotation
  ansible.builtin.command:
    argv:
      - "{{ install_bin_dir }}/oc"
      - annotate
      - sa
      - "{{ cluster_install_mos_puller_sa }}"
      - "-n"
      - "{{ cluster_install_mco_namespace }}"
      - "openshift.io/internal-registry-pull-secret-ref-"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  when:
    - cluster_install_mos_puller_annotation.stdout | trim | length > 0
  register: cluster_install_mos_puller_fix
  changed_when: true

- name: Render the CSR approval script
  ansible.builtin.template:
    src: approve-csrs.sh.j2
    dest: "{{ cluster_install_csr_script_path }}"
    mode: "0755"

- name: Approve CSRs until all workers are Ready
  # platform:none + SNO: no Machine objects and no node auto-approver —
  # kubelet CSRs need explicit approval (the BiP bootstrap-phase approver
  # died with the live environment).
  ansible.builtin.command:
    argv:
      - bash
      - "{{ cluster_install_csr_script_path }}"
  register: cluster_install_csr
  changed_when: "'approved:' in cluster_install_csr.stdout"

- name: Read the scheduler mastersSchedulable setting
  ansible.builtin.command:
    argv:
      - "{{ install_bin_dir }}/oc"
      - get
      - scheduler
      - cluster
      - "-o"
      - "jsonpath={.spec.mastersSchedulable}"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: cluster_install_schedulable
  changed_when: false

- name: Assert masters stay schedulable (SNO)
  ansible.builtin.assert:
    that:
      - cluster_install_schedulable.stdout | trim | lower == (masters_schedulable | bool | lower)
    fail_msg: >-
      mastersSchedulable is {{ cluster_install_schedulable.stdout | trim }}
      but the taxonomy says {{ masters_schedulable }} — the SNO master must
      stay schedulable (single node runs the workload).
    success_msg: masters schedulable ({{ masters_schedulable }}) — SNO OK.

- name: Pin the ingress router to the master
  # The default IngressController runs only on the
  # master so the *.apps hosts entries (master IP) stay valid across
  # worker restarts.
  # Deliberately `oc patch` and not kubernetes.core.k8s: the k8s action
  # plugin reads the kubeconfig on the controller as the invoking user,
  # but the installer's auth dir is root-owned 0700 (hardened) — only the
  # become-elevated module side can read it.
  ansible.builtin.command:
    argv:
      - "{{ install_bin_dir }}/oc"
      - patch
      - ingresscontroller
      - "{{ cluster_install_ingress_name }}"
      - "-n"
      - "{{ cluster_install_ingress_namespace }}"
      - "--type=merge"
      - "-p"
      - >-
        {"spec":{"nodePlacement":{"nodeSelector":{"matchLabels":{"node-role.kubernetes.io/master":""}},
        "tolerations":[{"key":"node-role.kubernetes.io/master","operator":"Exists","effect":"NoSchedule"}]}}}
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: cluster_install_ingress_pin
  changed_when: "'(no changes)' not in cluster_install_ingress_pin.stdout"

- name: Align the rendered container policy with the boot-time nightly relax
  # The ignition merge's policy-relax unit leaves an on-disk
  # /etc/containers/policy.json that differs from the payload-rendered
  # one; the MCD's on-disk validation then holds every worker pool
  # Degraded (observed live: "content mismatch for file
  # /etc/containers/policy.json (expected 255 bytes, got 175 bytes)").
  # Give each pool a MachineConfig carrying the SAME relaxed policy so
  # the rendered config matches the disk; the boot unit keeps covering
  # the ignition/overlay/mcd-pull window for strict-stock payloads.
  when: ocp_artifact_profile == 'nightly'
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_controller_path }}"
    definition: "{{ lookup('template', 'nightly-policy-machineconfig.yaml.j2') }}"
  loop: "{{ cluster_install_nightly_policy_mc_roles }}"
  loop_control:
    loop_var: mc_role

- name: Wait for cluster operators to settle
  # One poller over the whole operator table (fleet-parallel discipline):
  # green when every operator reports Available=True and Degraded=False.
  # cluster-api is excluded: on platform=None installs (bootstrap-in-place)
  # its CoreClusterController cannot map the platform to a CAPI
  # infrastructure-cluster kind, so the operator stays Progressing with
  # reason Uninitialized forever — upstream steady state, not a fault
  # (verified live: all controllers "initializing", no CAPI machines,
  # nothing to migrate; see cluster-capi-operator corecluster_controller.go
  # mapOCPPlatformToInfraClusterKindAndVersionAndGroup).
  ansible.builtin.shell: |
    set -o pipefail
    bad=$("{{ install_bin_dir }}/oc" get clusteroperators --no-headers 2>/dev/null \
      | awk '$1 != "cluster-api" && ($3 != "True" || $5 == "True")' | wc -l)
    if [ "${bad}" -gt 0 ]; then
      "{{ install_bin_dir }}/oc" get clusteroperators --no-headers 2>/dev/null \
        | awk '$1 != "cluster-api" && ($3 != "True" || $5 == "True") {print $1"("$3"/"$5")"}' >&2
      exit 1
    fi
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: cluster_install_operators
  until: cluster_install_operators.rc == 0
  retries: "{{ cluster_install_operator_retries }}"
  delay: "{{ cluster_install_operator_delay_seconds }}"
  changed_when: false

- name: Read cluster node states
  # Retried: a freshly-installed SNO API server can briefly time out on
  # list requests while post-install rollouts (MCO, router) still churn.
  ansible.builtin.command:
    argv:
      - "{{ install_bin_dir }}/oc"
      - get
      - nodes
      - "--no-headers"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: cluster_install_nodes
  until: cluster_install_nodes.rc == 0
  retries: 8
  delay: 15
  changed_when: false

- name: Wait for the pinned ingress router rollout
  # The nodePlacement patch redeploys the router; wait for every replica
  # to run on the master before asserting (fleet discipline: one poller).
  # Runs directly before the router-placement read that feeds the final
  # assert: the ingress operator can start a second roll moments after
  # the pin settles (observed live), and any gap between this wait and
  # the read is a window for a mid-roll assert failure — this ordering
  # closes it.
  # jsonpath, NOT `get -o wide` columns: oc 4.22 renders the RESTARTS
  # column as "2 (23m ago)" (two fields) once a restart ages, which shifts
  # every subsequent column — a fixed $N index silently checks the wrong
  # field. Phase and nodeName are format-independent.
  ansible.builtin.shell: |
    set -o pipefail
    lines=$("{{ install_bin_dir }}/oc" -n openshift-ingress get pods \
      -o 'jsonpath={range .items[*]}{.status.phase}{" "}{.spec.nodeName}{"\n"}{end}' \
      2>/dev/null | grep -v '^$' || true)
    [ -n "${lines}" ] || exit 1
    echo "${lines}" | awk -v master="{{ masters[0].name }}" '
      $1 != "Running" || $2 != master { bad = 1 }
      END { exit bad ? 1 : 0 }'
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: cluster_install_router_rollout
  until: cluster_install_router_rollout.rc == 0
  # 10-minute window: the operator terminates router pods gracefully during
  # post-install rolls (old pod Terminating + new pod Pending both count as
  # not-yet-settled); the SNO master churns for a while after first boot.
  retries: 40
  delay: 15
  changed_when: false

- name: Read ingress router placement
  ansible.builtin.command:
    argv:
      - "{{ install_bin_dir }}/oc"
      - "-n"
      - "openshift-ingress"
      - get
      - pods
      - "-o"
      - "wide"
      - "--no-headers"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: cluster_install_routers
  changed_when: false

- name: Read cluster version status
  ansible.builtin.command:
    argv:
      - "{{ install_bin_dir }}/oc"
      - get
      - clusterversion
      - "--no-headers"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: cluster_install_cv
  changed_when: false

- name: Read the master's current MachineConfig
  ansible.builtin.command:
    argv:
      - "{{ install_bin_dir }}/oc"
      - get
      - node
      - "{{ masters[0].name }}"
      - "-o"
      - "jsonpath={.metadata.annotations.machineconfiguration\\.openshift\\.io/currentConfig}"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: cluster_install_current_mc
  changed_when: false

- name: Read the current MachineConfig osImageURL
  ansible.builtin.command:
    argv:
      - "{{ install_bin_dir }}/oc"
      - get
      - machineconfig
      - "{{ cluster_install_current_mc.stdout | trim }}"
      - "-o"
      - "jsonpath={.spec.osImageURL}"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: cluster_install_osimage
  changed_when: false

- name: Assert the installed cluster state
  ansible.builtin.assert:
    that:
      - cluster_install_nodes.stdout_lines | length == cluster_install_node_count | int
      - >-
        cluster_install_nodes.stdout_lines | select('search', '\sReady\s') | list | length
        == cluster_install_node_count | int
      - cluster_install_routers.stdout_lines | length > 0
      # every router replica on the master (pinned placement)
      - >-
        cluster_install_routers.stdout_lines
        | reject('search', masters[0].name) | list | length == 0
      - cluster_install_cv.stdout is search('True')
      # master booted the payload machine-os-content (the layered image is
      # built FROM this ref; nodes must match until the MCO pivot)
      - cluster_install_osimage.stdout | trim == machine_os_content_ref
    fail_msg: >-
      Cluster state check failed — nodes:
      {{ cluster_install_nodes.stdout_lines | default([]) }},
      routers: {{ cluster_install_routers.stdout_lines | default([]) }},
      clusterversion: {{ cluster_install_cv.stdout | default('') }},
      master osImageURL: {{ cluster_install_osimage.stdout | default('') | trim }}
      (expected {{ machine_os_content_ref }}).
    success_msg: >-
      Cluster live — {{ cluster_install_node_count }}/{{ cluster_install_node_count }}
      nodes Ready, operators Available, routers pinned to {{ masters[0].name }}.

- name: Cluster install summary
  ansible.builtin.debug:
    msg: >-
      Cluster install OK — {{ cluster_install_node_count }}/{{
      cluster_install_node_count }} nodes Ready (SNO master schedulable),
      operators Available, clusterversion Available ({{ ocp_version }}),
      router pinned to the master, master osImageURL == pinned
      machine-os-content; console at {{ console_url }}.
