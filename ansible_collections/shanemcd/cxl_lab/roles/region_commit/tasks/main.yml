---
# region_commit: land the proven sysfs region-commit sequence on the CXL
# workers. The region-commit service ships via the workers' first-boot
# ignition (rendered from this role's ignition template by the
# install_config stage) and runs on the cxltest kernel from the first
# boot. This stage labels the workers into the install-time worker-cxl
# pool (rendered config == running config: no reboot, no rollout; the
# service from the first boot survives) and verifies the outcome: booted
# OS/kernel on the layered image, service active, region committed.
# Every step queries live state, so interrupted runs resume cleanly.

- name: Label the CXL workers for the worker-cxl pool
  # The install-time worker-cxl MachineConfigPool exists from bootstrap;
  # the workers fetch its rendered config via /config/worker-cxl at
  # first boot but kubelet still registers them with the plain worker
  # role label — add the pool label so the MCO reconciles the node into
  # worker-cxl.
  kubernetes.core.k8s:
    state: patched
    kubeconfig: "{{ kubeconfig_path }}"
    kind: Node
    name: "{{ item.name }}"
    definition:
      metadata:
        labels: "{{ {'node-role.kubernetes.io/' ~ worker_cxl_role_label: ''} }}"
  loop: "{{ cxl_workers }}"
  loop_control:
    label: "{{ item.name }}"

- name: Check the booted OS and kernel on every CXL worker
  # The workers must run the layered image's cxltest kernel: a node on
  # the stock payload runs the stock kernel and the region commit can
  # never succeed (no QEMU cache-sync bypass) — fail with the reason
  # instead of a generic service error.
  ansible.builtin.command:
    argv:
      - ssh
      - "-i"
      - "{{ install_ssh_key_path }}"
      - "-o"
      - "StrictHostKeyChecking=no"
      - "-o"
      - "UserKnownHostsFile=/dev/null"
      - "-o"
      - "ConnectTimeout=10"
      - "core@{{ lab_subnet_prefix }}.{{ item.ip_suffix }}"
      - >-
        rpm-ostree status | grep -m1 '^[* ]' ;
        uname -r ;
        systemctl is-active {{ region_commit_service_name }}
  loop: "{{ cxl_workers }}"
  loop_control:
    label: "{{ item.name }}"
  register: region_commit_booted_os
  until: region_commit_booted_os.rc == 0
  retries: "{{ region_commit_service_wait_retries }}"
  delay: "{{ region_commit_service_wait_delay }}"
  changed_when: false

- name: Assert the layered image and kernel on every CXL worker
  ansible.builtin.assert:
    that:
      - item.stdout is search(kernel_rpm_release)
      - item.stdout is search(layered_image_name)
    fail_msg: >-
      {{ item.item.name }} is not on the layered image: got
      {{ item.stdout | default('') | replace('\n', ' ; ') }} — expected
      the {{ layered_image_name }} deployment on kernel {{ kernel_rpm_release }}.
      If the deployment is the stock payload, the install-time osImageURL
      MachineConfig did not reach the worker's first-boot config.
  loop: "{{ region_commit_booted_os.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Check the region commit service on every CXL worker
  # The service ran at first boot — by the time this stage runs,
  # cluster_install has already waited for every node Ready, so this
  # normally passes on the first probe; the retries only cover a worker
  # whose first-boot units are still settling.
  ansible.builtin.command:
    argv:
      - ssh
      - "-i"
      - "{{ install_ssh_key_path }}"
      - "-o"
      - "StrictHostKeyChecking=no"
      - "-o"
      - "UserKnownHostsFile=/dev/null"
      - "-o"
      - "ConnectTimeout=10"
      - "core@{{ lab_subnet_prefix }}.{{ item.ip_suffix }}"
      - "sudo systemctl is-active {{ region_commit_service_name }}"
  loop: "{{ cxl_workers }}"
  loop_control:
    label: "{{ item.name }}"
  register: region_commit_service
  until: region_commit_service.rc == 0
  retries: "{{ region_commit_service_wait_retries }}"
  delay: "{{ region_commit_service_wait_delay }}"
  failed_when: false
  changed_when: false

- name: Assert the service is active on every CXL worker
  ansible.builtin.assert:
    that:
      - item.rc | int == 0
    fail_msg: >-
      {{ region_commit_service_name }} not active on {{ item.item.name }} —
      the first-boot ignition did not land the region-commit service;
      inspect the serial log under {{ vm_logs_dir }}.
  loop: "{{ region_commit_service.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Read the region commit state on every CXL worker
  ansible.builtin.command:
    argv:
      - ssh
      - "-i"
      - "{{ install_ssh_key_path }}"
      - "-o"
      - "StrictHostKeyChecking=no"
      - "-o"
      - "UserKnownHostsFile=/dev/null"
      - "-o"
      - "ConnectTimeout=10"
      - "core@{{ lab_subnet_prefix }}.{{ item.ip_suffix }}"
      - "sudo cat /sys/bus/cxl/devices/{{ region_commit_region_name }}/commit"
  loop: "{{ cxl_workers }}"
  loop_control:
    label: "{{ item.name }}"
  register: region_commit_state
  changed_when: false

- name: Assert the region is committed on every CXL worker
  ansible.builtin.assert:
    that:
      - item.stdout | trim == '1'
    fail_msg: >-
      {{ region_commit_region_name }}/commit is
      '{{ item.stdout | trim }}' on {{ item.item.name }}, expected 1.
  loop: "{{ region_commit_state.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Region commit summary
  ansible.builtin.debug:
    msg: >-
      region commit OK —
      {{ cxl_workers | map(attribute='name') | join(', ') }} committed
      {{ region_commit_region_name }} ({{ cxl_workers[0].vmem_size }});
      service {{ region_commit_service_name }} active on every one
      (shipped via worker ignition).
