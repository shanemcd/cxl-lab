---
# Per-worker region-commit recovery (included with loop_var: worker).
# The unit self-recovers from the stale DVSEC MEM_ENABLE state in the guest
# (setpci clear + cxl_pci rebind), so the normal path is: wait for the service
# to go active, then assert the region is committed. The cold-restart block is
# the fallback for a genuinely wedged node — including a node that is already
# down from an interrupted run (poweroff/ssh simply fail, the QEMU exit wait
# sees it stopped, and the cold-start brings it back).

- name: Wait for the region commit service to succeed on {{ worker.name }}
  ansible.builtin.command:
    argv:
      - ssh
      - "-i"
      - "{{ install_ssh_key_path }}"
      - "-o"
      - "StrictHostKeyChecking=no"
      - "-o"
      - "UserKnownHostsFile=/dev/null"
      - "-o"
      - "ConnectTimeout=10"
      - "core@{{ lab_subnet_prefix }}.{{ worker.ip_suffix }}"
      - "sudo systemctl is-active {{ region_commit_service_name }}"
  register: region_commit_service_final
  until: region_commit_service_final.rc == 0
  retries: "{{ region_commit_service_wait_retries }}"
  delay: "{{ region_commit_service_wait_delay }}"
  failed_when: false
  changed_when: false

- name: Cold-restart to recover the region commit service on {{ worker.name }}
  when: region_commit_service_final.rc != 0
  block:

    - name: Drain {{ worker.name }}
      ansible.builtin.command:
        argv:
          - "{{ install_bin_dir }}/oc"
          - adm
          - drain
          - "{{ worker.name }}"
          - "--ignore-daemonsets"
          - "--delete-emptydir-data"
          - "--force"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      # The node may be NotReady already or drained by an interrupted run.
      failed_when: false
      changed_when: true

    - name: Power off via the guest on {{ worker.name }}
      ansible.builtin.command:
        argv:
          - ssh
          - "-i"
          - "{{ install_ssh_key_path }}"
          - "-o"
          - "StrictHostKeyChecking=no"
          - "-o"
          - "UserKnownHostsFile=/dev/null"
          - "-o"
          - "ConnectTimeout=10"
          - "core@{{ lab_subnet_prefix }}.{{ worker.ip_suffix }}"
          - "sudo systemctl poweroff"
      # The guest may be wedged or already down from an interrupted run.
      failed_when: false
      changed_when: true

    - name: Wait for the QEMU process to exit on {{ worker.name }}
      ansible.builtin.command:
        argv:
          - bash
          - "{{ vm_scripts_dir }}/run-{{ worker.name }}.sh"
          - --status
      register: region_commit_exit_status
      until: region_commit_exit_status.rc == 3
      retries: "{{ region_commit_stop_wait_retries }}"
      delay: "{{ region_commit_stop_wait_delay }}"
      failed_when: false
      changed_when: false

    - name: Force-stop the wedged guest on {{ worker.name }}
      when: region_commit_exit_status.rc != 3
      ansible.builtin.command:
        argv:
          - bash
          - "{{ vm_scripts_dir }}/run-{{ worker.name }}.sh"
          - --stop
      changed_when: true

    - name: Confirm the QEMU process exited on {{ worker.name }}
      ansible.builtin.command:
        argv:
          - bash
          - "{{ vm_scripts_dir }}/run-{{ worker.name }}.sh"
          - --status
      register: region_commit_exit_confirm
      # rc 3 (stopped) surfaces as a module error - the assert below owns the check.
      failed_when: false
      changed_when: false

    - name: Assert the QEMU process exited on {{ worker.name }}
      ansible.builtin.assert:
        that:
          - region_commit_exit_confirm.rc == 3
        fail_msg: >-
          {{ worker.name }} QEMU did not exit within
          {{ region_commit_stop_wait_retries * region_commit_stop_wait_delay }}s
          of the poweroff request, and the --stop force fallback failed.

    - name: Cold-start {{ worker.name }}
      ansible.builtin.command:
        argv:
          - bash
          - "{{ vm_scripts_dir }}/run-{{ worker.name }}.sh"
      register: region_commit_cold_start
      changed_when: "'already running' not in region_commit_cold_start.stdout"

    - name: Wait to be Ready again on {{ worker.name }}
      ansible.builtin.command:
        argv:
          - "{{ install_bin_dir }}/oc"
          - wait
          - "node/{{ worker.name }}"
          - "--for=condition=Ready"
          - "--timeout={{ region_commit_node_ready_timeout_minutes }}m"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: false

    - name: Uncordon {{ worker.name }}
      ansible.builtin.command:
        argv:
          - "{{ install_bin_dir }}/oc"
          - adm
          - uncordon
          - "{{ worker.name }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true

    - name: Wait for the region commit service to succeed again on {{ worker.name }}
      ansible.builtin.command:
        argv:
          - ssh
          - "-i"
          - "{{ install_ssh_key_path }}"
          - "-o"
          - "StrictHostKeyChecking=no"
          - "-o"
          - "UserKnownHostsFile=/dev/null"
          - "-o"
          - "ConnectTimeout=10"
          - "core@{{ lab_subnet_prefix }}.{{ worker.ip_suffix }}"
          - "sudo systemctl is-active {{ region_commit_service_name }}"
      register: region_commit_service_after
      until: region_commit_service_after.rc == 0
      retries: "{{ region_commit_service_wait_retries }}"
      delay: "{{ region_commit_service_wait_delay }}"
      failed_when: false
      changed_when: false

- name: Select the service state verdict on {{ worker.name }}
  ansible.builtin.set_fact:
    region_commit_service_verdict: "{{ region_commit_service_after.rc
                                       | default(region_commit_service_final.rc) }}"

- name: Assert the region commit service is active on {{ worker.name }}
  ansible.builtin.assert:
    that:
      - region_commit_service_verdict | int == 0
    fail_msg: >-
      {{ region_commit_service_name }} not active on {{ worker.name }} — inspect
      `ssh core@{{ lab_subnet_prefix }}.{{ worker.ip_suffix }}
      'sudo journalctl -u {{ region_commit_service_name }} --no-pager'`.

- name: Read the region commit state on {{ worker.name }}
  ansible.builtin.command:
    argv:
      - ssh
      - "-i"
      - "{{ install_ssh_key_path }}"
      - "-o"
      - "StrictHostKeyChecking=no"
      - "-o"
      - "UserKnownHostsFile=/dev/null"
      - "-o"
      - "ConnectTimeout=10"
      - "core@{{ lab_subnet_prefix }}.{{ worker.ip_suffix }}"
      - "sudo cat /sys/bus/cxl/devices/{{ region_commit_region_name }}/commit"
  register: region_commit_state
  changed_when: false

- name: Assert the region is committed on {{ worker.name }}
  ansible.builtin.assert:
    that:
      - region_commit_state.stdout | trim == '1'
    fail_msg: >-
      {{ region_commit_region_name }}/commit is
      '{{ region_commit_state.stdout | trim }}' on {{ worker.name }}, expected 1.
