---
# render-snippet: render the region-commit ignition snippet for the CXL
# workers' first-boot ignition. Included from the install_config role so
# the per-node merge can fold the snippet into each CXL worker's ignition.

- name: Assert every CXL worker carries the same vmem size
  ansible.builtin.assert:
    that:
      - cxl_workers | map(attribute='vmem_size') | unique | list | length == 1
    fail_msg: >-
      The shared region-commit config assumes one vmem size across CXL
      workers (found {{ cxl_workers | map(attribute='vmem_size') | unique | join(', ') }}).

- name: Set the region commit script fact
  ansible.builtin.set_fact:
    region_commit_script_b64: "{{ lookup('template', 'cxl-region-commit.sh.j2') | b64encode }}"

- name: Write the region commit ignition snippet
  # Rendered to a file only — nothing cluster-facing happens here (the
  # cluster does not exist yet at 05).
  ansible.builtin.copy:
    content: "{{ lookup('template', 'region-commit-ignition.yaml.j2') | from_yaml | to_json }}"
    dest: "{{ region_commit_ignition_snippet_path }}"
    mode: "0600"
