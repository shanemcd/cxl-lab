---
# region_commit role-scoped knobs; node data and the unit/region names come
# from the topology taxonomy (shared with verify).
region_commit_script_guest_path: "/usr/local/sbin/cxl-region-commit.sh"
region_commit_ignition_version: "3.2.0"

# The decoders are DISCOVERED at runtime in the guest (the endpoint decoders
# are the decoder*.* children of endpoint ports; the root decoder carries
# create_ram_region) — kernel enumeration order is not stable. The unit and
# region names live in the topology taxonomy (shared with verify).

# Stale-MEM_ENABLE self-recovery (validated live on a CXL worker, Oct 9): the
# kernel sets DVSEC MEM_ENABLE on the first successful endpoint probe, QEMU
# preserves DVSEC config across reboots/re-probes, and the strict
# cxl_hdm_decode_init() range validation then rejects the next probe. The unit
# clears the bit via setpci and rebinds cxl_pci.
# CXL 2.0 8.1.3.2 Control: bit 2 (0x4) = Mem Enable.
region_commit_mem_enable_mask: 4
# CXL 2.0 8.1.3: the Control word sits at DVSEC capability start + 0xC.
region_commit_dvsec_ctrl_offset: 12
region_commit_endpoint_wait_seconds: 60
# 60s: first-boot CXL enumeration can take ~20s amid systemd boot
# parallelism (observed live); the MCO-path second boot publishes decoders
# in ~2s. The wait is a cheap 1s poll, so patience is free — and the
# stale-MEM_ENABLE recovery must NOT fire while the kernel is still probing
# (it races enumeration into a half-committed region).
region_commit_endpoint_recover_wait_seconds: 60
region_commit_driver_rebind_delay: 2
region_commit_service_timeout_seconds: 300

# Service probe timings — values come from the fleet-wide VM lifecycle
# knobs in the topology taxonomy (shared with teardown and the ops roles).
region_commit_service_wait_retries: "{{ vm_service_wait_retries }}"
region_commit_service_wait_delay: "{{ vm_service_wait_delay }}"
