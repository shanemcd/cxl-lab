---
# artifacts role-scoped knobs; versions/URLs/SHAs live in the versions taxonomy
# (group_vars/all/versions.yml) and paths (including the artifacts subdirs) in
# the paths taxonomy (group_vars/all/paths.yml).

# Pinned downloads (empty sha256 entries are trust-on-first-use: the role
# refuses to proceed and prints the computed checksum to pin in versions.yml).
# The kernel SRPM is NOT here — it is acquired by the artifacts role
# (entitled CDN download) after the osimage NVR is read.
artifacts_downloads:
  - name: openshift_install
    url: "{{ openshift_client_base_url }}/{{ ocp_version }}/{{ openshift_install_tarball_name }}"
    dest: "{{ artifacts_downloads_dir }}/{{ openshift_install_tarball_name }}"
    sha256: "{{ openshift_install_sha256 }}"
  - name: openshift_client
    url: "{{ openshift_client_base_url }}/{{ ocp_version }}/{{ openshift_client_tarball_name }}"
    dest: "{{ artifacts_downloads_dir }}/{{ openshift_client_tarball_name }}"
    sha256: "{{ oc_sha256 }}"
  - name: qemu_source
    url: "{{ qemu_source_url }}"
    dest: "{{ artifacts_downloads_dir }}/{{ qemu_source_url | basename }}"
    sha256: "{{ qemu_source_sha256 }}"

# Local-cache seeds: copied into the artifact dirs before any network
# fetch; every seeded file then flows through the normal checksum
# verification, so a bad seed cannot pass. The mirror sha256sum manifest
# is NOT here — it is GA-profile-only (the CI artifacts service publishes
# no checksum manifest; nightly tarball checksums are pinned in
# versions.yml instead).
artifacts_cache_seeds:
  - name: "{{ openshift_install_tarball_name }}"
    dest: "{{ artifacts_downloads_dir }}/{{ openshift_install_tarball_name }}"
  - name: "{{ openshift_client_tarball_name }}"
    dest: "{{ artifacts_downloads_dir }}/{{ openshift_client_tarball_name }}"
  - name: "{{ kernel_srpm_nvr }}.src.rpm"
    dest: "{{ artifacts_srpm_dir }}/{{ kernel_srpm_nvr }}.src.rpm"
  - name: "{{ rhcos_iso_image_name }}"
    dest: "{{ rhcos_live_iso_path }}"

# Kernel SRPM sha pin selection happens in tasks (per kernel_srpm_source).

# Entitled CDN SRPM download: repo file + script rendered into
# artifacts_srpm_dir; the container mounts the host RHSM entitlement read-only
# (paths discovered at runtime — never hardcoded) and runs with SELinux
# confinement disabled so it can read the host-labelled certs.
artifacts_cdn_repo_file_name: "cdn-kernel-source.repo"
artifacts_cdn_download_script_name: "cdn-srpm-download.sh"
artifacts_cdn_container_name: "cxl-lab-srpm-downloader"
artifacts_cdn_download_wait_retries: 40
artifacts_cdn_download_wait_delay: 15

# Version stamp guarding client-tool extraction (unarchive has no content
# comparison; the stamp makes re-extraction happen only on version change).
artifacts_client_stamp_name: ".ocp-version"
