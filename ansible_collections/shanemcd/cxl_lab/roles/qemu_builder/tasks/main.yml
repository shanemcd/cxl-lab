---
# qemu_builder: provide the host QEMU with CXL Type-3 emulation.
#
# Source resolution (qemu_source: auto | distro | pinned, topology.yml):
#   - distro: the distribution's qemu-system-x86_64 (Fedora's
#     qemu-system-x86-core carries upstream CXL — nothing is built);
#   - pinned: stock upstream QEMU built in the shared RHEL 10 builder
#     container (entitled CDN build deps via the host RHSM entitlement)
#     and installed to the host prefix — no patch, no podman commit, no
#     runtime image (RHEL's appstream qemu-kvm lacks CXL, so this remains
#     the RHEL path). The build is launched fire-and-forget here and
#     collected by the vms play (collect.yml) so it overlaps the kernel
#     and image builds that follow;
#   - auto (default): distro binary when it exists and carries pxb-cxl /
#     cxl-rp / cxl-type3, else the pinned build.
# The exists-guard keys off the versioned prefix, so pinned re-runs skip
# the build and teardown never removes the prefix (the distro binary is a
# distro package — also never touched).

- name: Stat the distro QEMU binary
  ansible.builtin.stat:
    path: "{{ qemu_distro_binary_path }}"
  register: qemu_builder_distro_stat

- name: Read the distro QEMU device list
  when:
    - qemu_builder_distro_stat.stat.exists
    - qemu_source != 'pinned'
  ansible.builtin.command:
    argv:
      - "{{ qemu_distro_binary_path }}"
      - "-device"
      - help
  register: qemu_builder_distro_devices
  changed_when: false

- name: Set the resolved QEMU source fact
  # auto falls back to the pinned build when the distro binary is absent
  # or lacks CXL; an explicit 'distro' must not silently downgrade.
  ansible.builtin.set_fact:
    qemu_builder_source: >-
      {{ 'distro'
         if (qemu_source == 'distro'
             or (qemu_source == 'auto'
                 and qemu_builder_distro_stat.stat.exists
                 and qemu_builder_distro_devices.stdout is defined
                 and qemu_builder_distro_devices.stdout is search('name "pxb-cxl"')
                 and qemu_builder_distro_devices.stdout is search('name "cxl-rp"')
                 and qemu_builder_distro_devices.stdout is search('name "cxl-type3"')))
         else 'pinned' }}

- name: Assert the forced distro QEMU is usable
  when: qemu_source == 'distro'
  ansible.builtin.assert:
    that:
      - qemu_builder_source == 'distro'
    fail_msg: >-
      qemu_source is 'distro' but {{ qemu_distro_binary_path }} is missing
      or lacks pxb-cxl / cxl-rp / cxl-type3 — install the distro QEMU
      (Fedora: qemu-system-x86-core) or set qemu_source: pinned.

- name: Handle the distro QEMU path
  when: qemu_builder_source == 'distro'
  block:

    - name: Point the lab at the distro QEMU binary
      # Overrides the pinned-path group var for every later play (02 runs
      # before the master VM stage in site.yml).
      # noqa: var-naming[no-role-prefix]
      ansible.builtin.set_fact:
        qemu_binary_path: "{{ qemu_distro_binary_path }}"

    - name: Stamp the resolved binary for later plays and standalone runs
      # The set_fact above only lives inside one ansible-playbook
      # invocation; the vms role (standalone or a later run) reads this
      # stamp instead. The pinned branch removes it, falling the consumers
      # back to the pinned-path group var.
      ansible.builtin.copy:
        content: "{{ qemu_distro_binary_path }}\n"
        dest: "{{ vm_scripts_dir }}/{{ qemu_source_stamp_name }}"
        mode: "0644"

    - name: Read the distro QEMU version
      ansible.builtin.command:
        argv:
          - "{{ qemu_distro_binary_path }}"
          - "--version"
      register: qemu_builder_distro_version
      changed_when: false

    - name: Distro QEMU summary
      ansible.builtin.debug:
        msg: >-
          qemu builder OK — using the distribution QEMU at
          {{ qemu_distro_binary_path }}
          ({{ (qemu_builder_distro_version.stdout | default('')) | regex_replace('\\n.*', '') }})
          with pxb-cxl / cxl-rp / cxl-type3 device support; no custom
          build, no prefix.

- name: Stat the installed pinned QEMU binary (exists-guard)
  when: qemu_builder_source == 'pinned'
  ansible.builtin.stat:
    path: "{{ qemu_binary_path }}"
  register: qemu_builder_binary_stat

- name: Remove a stale distro-QEMU stamp on the pinned path
  # Consumers fall back to the pinned-path group var when the stamp is
  # absent.
  when: qemu_builder_source == 'pinned'
  ansible.builtin.file:
    path: "{{ vm_scripts_dir }}/{{ qemu_source_stamp_name }}"
    state: absent

- name: Launch the stock upstream QEMU build
  # Fire-and-forget on purpose: the builder container is detached, and the
  # collection (wait, install, validation) is deferred to the vms play via
  # collect.yml so the ~10-minute in-container build overlaps the kernel
  # RPM build and image builds that follow in the pipeline. Nothing needs
  # the binary until the first VM starts.
  when:
    - qemu_builder_source == 'pinned'
    - not qemu_builder_binary_stat.stat.exists
  block:

    - name: Ensure the QEMU build workspace
      ansible.builtin.file:
        path: "{{ qemu_build_dir }}"
        state: directory
        mode: "0755"

    - name: Stage the SHA-verified QEMU source tarball in the workspace
      ansible.builtin.copy:
        src: "{{ artifacts_downloads_dir }}/{{ qemu_source_url | basename }}"
        dest: "{{ qemu_build_dir }}/{{ qemu_source_url | basename }}"
        remote_src: true
        mode: "0644"

    - name: Discover the host RHSM entitlement key
      ansible.builtin.find:
        paths: "{{ rhsm_entitlement_dir }}"
        patterns: '*-key.pem'
      register: qemu_builder_entitlement_keys

    - name: Assert exactly one entitlement key exists
      ansible.builtin.assert:
        that:
          - qemu_builder_entitlement_keys.files | length == 1
        fail_msg: >-
          Expected exactly one entitlement key in {{ rhsm_entitlement_dir }},
          found {{ qemu_builder_entitlement_keys.files | length }} — the
          QEMU build needs the host RHSM entitlement for CDN access.

    - name: Set the entitlement certificate facts
      ansible.builtin.set_fact:
        qemu_builder_entitlement_key: "{{ qemu_builder_entitlement_keys.files[0].path }}"
        qemu_builder_entitlement_cert: >-
          {{ qemu_builder_entitlement_keys.files[0].path | regex_replace('-key\.pem$', '.pem') }}

    - name: Stat the RHSM CA file
      ansible.builtin.stat:
        path: "{{ rhsm_ca_dir }}/redhat-uep.pem"
      register: qemu_builder_rhsm_ca_stat

    - name: Assert the RHSM CA file exists
      ansible.builtin.assert:
        that:
          - qemu_builder_rhsm_ca_stat.stat.exists
        fail_msg: >-
          {{ rhsm_ca_dir }}/redhat-uep.pem missing — the QEMU build needs
          the host's RHSM CA (is the host registered?).

    - name: Render the entitled CDN repo file for the builder
      ansible.builtin.template:
        src: qemu-builder-repos.repo.j2
        dest: "{{ qemu_builder_repo_file_path }}"
        mode: "0644"

    - name: Render the QEMU build script
      ansible.builtin.template:
        src: qemu-build.sh.j2
        dest: "{{ qemu_builder_script_path }}"
        mode: "0755"

    - name: Remove stale QEMU builder container
      containers.podman.podman_container:
        name: "{{ qemu_builder_container_name }}"
        state: absent

    - name: Run the QEMU builder container
      # Base = the shared RHEL 10 builder image (registry auth via the pull
      # secret — registry.redhat.io requires login even for pulls; the
      # logged-in root session is NOT relied upon).
      containers.podman.podman_container:
        name: "{{ qemu_builder_container_name }}"
        image: "{{ rhel10_builder_image }}"
        state: started
        command: "bash {{ qemu_builder_workspace_mount }}/{{ qemu_builder_script_path | basename }}"
        authfile: "{{ pull_secret_path }}"
        security_opt:
          - label=disable
        volumes:
          - "{{ qemu_build_dir }}:{{ qemu_builder_workspace_mount }}:Z"
          - "{{ qemu_builder_repo_file_path }}:/etc/yum.repos.d/{{ qemu_builder_repo_file_name }}:ro"
          - "{{ rhsm_entitlement_dir }}:{{ rhsm_entitlement_dir }}:ro"
          - "{{ rhsm_ca_dir }}:{{ rhsm_ca_dir }}:ro"

    - name: Mark the QEMU build as in flight
      # The vms play collects this build (wait + install + validation) via
      # qemu_builder's collect.yml before starting any VM.
      ansible.builtin.set_fact:
        qemu_builder_build_in_flight: true

- name: Validate the installed pinned QEMU
  # Warm path (prefix already installed, nothing in flight): validate the
  # binary in place. The fresh path collects in the vms play instead —
  # collect.yml holds the shared wait/install/validation tail.
  when:
    - qemu_builder_source == 'pinned'
    - not (qemu_builder_build_in_flight | default(false))
  ansible.builtin.include_tasks: collect.yml
