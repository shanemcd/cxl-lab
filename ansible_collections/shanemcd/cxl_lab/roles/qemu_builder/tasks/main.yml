---
# qemu_builder: build stock upstream QEMU in a digest-pinned CS10 builder
# container and install it to the host prefix — no patch, no podman commit,
# no runtime image. The exists-guard keys off the versioned prefix, so
# re-runs skip the build and teardown never removes the prefix.

- name: Stat the installed QEMU binary (exists-guard)
  ansible.builtin.stat:
    path: "{{ qemu_binary_path }}"
  register: qemu_builder_binary_stat

- name: Build and install stock upstream QEMU
  when: not qemu_builder_binary_stat.stat.exists
  block:

    - name: Ensure the QEMU build workspace
      ansible.builtin.file:
        path: "{{ qemu_build_dir }}"
        state: directory
        mode: "0755"

    - name: Stage the SHA-verified QEMU source tarball in the workspace
      ansible.builtin.copy:
        src: "{{ artifacts_downloads_dir }}/{{ qemu_source_url | basename }}"
        dest: "{{ qemu_build_dir }}/{{ qemu_source_url | basename }}"
        remote_src: true
        mode: "0644"

    - name: Render the QEMU build script
      ansible.builtin.template:
        src: qemu-build.sh.j2
        dest: "{{ qemu_builder_script_path }}"
        mode: "0755"

    - name: Remove stale QEMU builder container
      containers.podman.podman_container:
        name: "{{ qemu_builder_container_name }}"
        state: absent

    - name: Run the QEMU builder container
      containers.podman.podman_container:
        name: "{{ qemu_builder_container_name }}"
        image: "{{ qemu_builder_base_image }}"
        state: started
        command: "bash {{ qemu_builder_workspace_mount }}/{{ qemu_builder_script_path | basename }}"
        volumes:
          - "{{ qemu_build_dir }}:{{ qemu_builder_workspace_mount }}:Z"

    - name: Wait for the QEMU build to finish
      containers.podman.podman_container_info:
        name: "{{ qemu_builder_container_name }}"
      register: qemu_builder_state
      until: >-
        qemu_builder_state.containers | length == 0
        or not qemu_builder_state.containers[0].State.Running
      retries: "{{ qemu_builder_wait_retries }}"
      delay: "{{ qemu_builder_wait_delay }}"

    - name: Assert the QEMU build succeeded
      ansible.builtin.assert:
        that:
          - qemu_builder_state.containers | length == 1
          - qemu_builder_state.containers[0].State.ExitCode == 0
        fail_msg: >-
          QEMU builder exited with
          {{ qemu_builder_state.containers[0].State.ExitCode | default('no state') }} —
          inspect `podman logs {{ qemu_builder_container_name }}`.

    - name: Remove the QEMU builder container
      containers.podman.podman_container:
        name: "{{ qemu_builder_container_name }}"
        state: absent

    - name: Assert the staged install tree exists
      ansible.builtin.stat:
        path: "{{ qemu_builder_staging_dir }}{{ qemu_binary_path }}"
      register: qemu_builder_staged_binary_stat

    - name: Assert the staged QEMU binary exists
      ansible.builtin.assert:
        that:
          - qemu_builder_staged_binary_stat.stat.exists
          - qemu_builder_staged_binary_stat.stat.executable | default(false)
        fail_msg: >-
          Staged binary {{ qemu_builder_staging_dir }}{{ qemu_binary_path }} missing
          or not executable — the builder install step failed.

    - name: Copy the staged tree to the host prefix
      ansible.builtin.command:
        argv:
          - cp
          - -a
          - "{{ qemu_builder_staging_dir }}{{ qemu_install_prefix }}"
          - "{{ qemu_install_prefix | dirname }}"
      changed_when: true

    - name: Restore SELinux contexts on the host prefix
      ansible.builtin.command:
        argv:
          - restorecon
          - "-R"
          - "{{ qemu_install_prefix }}"
      when: (ansible_facts.get('selinux') or {}).get('status') == 'enabled'
      changed_when: false

- name: Ensure the host runtime libraries for the CS10-built binary
  ansible.builtin.package:
    name: "{{ qemu_builder_runtime_packages }}"
    state: present
  when: qemu_builder_runtime_packages | length > 0

- name: Assert the installed QEMU binary exists
  ansible.builtin.stat:
    path: "{{ qemu_binary_path }}"
  register: qemu_builder_binary_final_stat

- name: Assert QEMU binary presence
  ansible.builtin.assert:
    that:
      - qemu_builder_binary_final_stat.stat.exists
      - qemu_builder_binary_final_stat.stat.executable | default(false)
    fail_msg: "Host QEMU binary {{ qemu_binary_path }} missing or not executable."

- name: Read the installed QEMU version
  ansible.builtin.command:
    argv:
      - "{{ qemu_binary_path }}"
      - "--version"
  register: qemu_builder_version_raw
  changed_when: false

- name: Assert the installed QEMU version
  ansible.builtin.assert:
    that:
      - qemu_version in qemu_builder_version_raw.stdout
    fail_msg: >-
      {{ qemu_binary_path }} does not report version {{ qemu_version }} —
      remove the prefix and re-run.

- name: Read the installed QEMU device list
  ansible.builtin.command:
    argv:
      - "{{ qemu_binary_path }}"
      - "-device"
      - help
  register: qemu_builder_device_help
  changed_when: false

- name: Assert CXL device support in the host QEMU
  ansible.builtin.assert:
    that:
      - qemu_builder_device_help.stdout is search('name "pxb-cxl"')
      - qemu_builder_device_help.stdout is search('name "cxl-rp"')
      - qemu_builder_device_help.stdout is search('name "cxl-type3"')
    success_msg: >-
      Host QEMU {{ qemu_version }} at {{ qemu_binary_path }} with pxb-cxl /
      cxl-rp / cxl-type3 device support.

- name: QEMU builder summary
  ansible.builtin.debug:
    msg: >-
      qemu builder OK — stock upstream {{ qemu_version }} built in the CS10
      builder and installed to {{ qemu_install_prefix }} (built this run:
      {{ not qemu_builder_binary_stat.stat.exists }}); CXL devices verified.
