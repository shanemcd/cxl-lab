---
# qemu_builder role-scoped knobs; images/versions live in the versions taxonomy
# (group_vars/all/versions.yml) and paths in the paths taxonomy.

# Build workspace (tarball staging + build script + DESTDIR staging tree).
# The workspace is mounted into the builder at the same in-container path
# (qemu_builder_workspace_mount) — the build script's DESTDIR refers to the
# in-container path so the staged tree lands in the host-mounted directory.
qemu_builder_script_path: "{{ qemu_build_dir }}/qemu-build.sh"
qemu_builder_staging_dir: "{{ qemu_build_dir }}/staging"
qemu_builder_workspace_mount: /workspace

# Build dependencies installed inside the shared RHEL 10 builder from
# the entitled CDN repos (baseos + appstream; CRB is not carried by the
# lab's entitlement — meson and ninja come from pip inside the builder
# instead, and libfdt is not needed: x86 targets do not use FDT and the
# build passes -Dwrap_mode=nodownload, so meson disables it cleanly).
qemu_builder_build_deps:
  - gcc
  - gcc-c++
  - make
  - glib2-devel
  - pixman-devel
  - bzip2
  - diffutils
  - xz
  - python3
  - python3-pip

# Entitled CDN repo file staged for the builder container (rendered from
# qemu-builder-repos.repo.j2, mounted at /etc/yum.repos.d/).
qemu_builder_repo_file_name: "qemu-builder-cdn.repo"
qemu_builder_repo_file_path: "{{ qemu_build_dir }}/{{ qemu_builder_repo_file_name }}"
qemu_builder_repo_ids:
  - rhel-10-baseos
  - rhel-10-appstream

# Full-build container polling (configure + ninja on 48 cores takes ~5 min
# cold, ~10 min with the metadata + pip downloads).
qemu_builder_wait_retries: 120
qemu_builder_wait_delay: 15

# Ninja parallelism inside the builder container — deliberately bounded:
# the build overlaps the kernel RPM build (see the build script and the
# launch/collect split in the role tasks).
qemu_builder_ninja_jobs: 32
