# vms: one host-QEMU run script per node — a QEMU with CXL Type-3
# emulation, resolved by the qemu_builder role (distribution binary when
# it carries pxb-cxl — Fedora's qemu-system-x86-core; otherwise the
# pinned upstream build in the RHEL 10 builder — RHEL's appstream qemu-kvm
# has no
# CXL backports). Master = BiP boot model (live ISO + blank
# virtio install target + merged BiP ignition); workers = per-node merged
# ignition (MCS stubs) over overlays of the pre-baked BIB disk
# (workers boot the cxltest kernel from first boot). CXL workers carry
# the emulated Type-3 graph MINUS host-node binding (host NUMA placement is
# intentionally first-touch). Boot sequence: master first, then workers
# at the master's install-to-disk reboot — sysroot on the BiP disk proves
# the live env (and its bootstrap-era MCS) is gone, so the workers ride
# ignition's config-fetch retry loop until the installed master's Machine
# Config Server answers (their first-boot ignition fetch targets it).
# No per-VM containers, no QEMU patch image.
# The role runs in two phases so the pipeline can overlap the master's
# install and convergence with the kernel/image builds (see 05_master.yml
# and 07_workers.yml): master.yml prepares and starts the master (no
# waiting — the layered_image stage builds while the master installs);
# workers.yml (which needs the pre-baked BIB disk from the layered_image
# stage) gates on the master's install-to-disk reboot, starts the worker
# fleet, waits for boot evidence, and holds until the installed master's
# Machine Config Server answers. main.yml runs both phases in sequence
# for ad-hoc full-role use.

- name: Run the master phase
  ansible.builtin.include_tasks: master.yml

- name: Run the workers phase
  ansible.builtin.include_tasks: workers.yml
