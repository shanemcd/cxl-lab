---
# mco_cxl: move every CXL worker onto the layered cxltest OS image via MCO
# Labels, worker-cxl MachineConfigPool, an osImageURL MachineConfig
# referencing the authoritative registry digest stamp, and a rollout wait;
# asserts the booted kernel on every worker afterwards.

- name: Stat the layered image digest stamp
  ansible.builtin.stat:
    path: "{{ layered_image_digest_stamp_path }}"
  register: mco_cxl_stamp_stat

- name: Read the layered image digest stamp
  ansible.builtin.slurp:
    src: "{{ layered_image_digest_stamp_path }}"
  register: mco_cxl_stamp_raw
  when: mco_cxl_stamp_stat.stat.exists

- name: Set the osImageURL fact
  ansible.builtin.set_fact:
    mco_cxl_osimage_url: >-
      {{ registry_host }}/{{ layered_image_name }}@{{ mco_cxl_stamp_raw.content | default('') | b64decode | trim }}

- name: Assert the osImageURL digest
  ansible.builtin.assert:
    that:
      - mco_cxl_osimage_url is match('^.+@sha256:[0-9a-f]{64}$')
    fail_msg: >-
      No authoritative layered-image digest at {{ layered_image_digest_stamp_path }}
      — run the 04_os_image stage first (the osImageURL must reference the
      registry's
      Docker-Content-Digest, never podman's RepoDigest).

- name: Wait for the cluster API to be ready
  # Moved from the layered_image stage (which now runs before the cluster
  # exists): this is the first cluster-touching task of the MCO path. The
  # master can reboot itself a few minutes after the install settles
  # (machine-config daemon applying a config delta).
  ansible.builtin.command:
    argv:
      - "{{ install_bin_dir }}/oc"
      - get
      - "--raw=/readyz"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: mco_cxl_api_ready
  until: mco_cxl_api_ready.rc == 0
  retries: 40
  delay: 15
  changed_when: false

- name: Teach the cluster to trust the lab registry
  # The workers' pivot pulls the layered image over plain HTTP from the lab
  # registry; the cluster's Image config drives the registries.conf the MCO
  # renders into every node. (The pre-baked path bakes the same trust in as
  # an install-time manifest — see the install_config role.)
  kubernetes.core.k8s:
    state: patched
    kubeconfig: "{{ kubeconfig_path }}"
    api_version: config.openshift.io/v1
    kind: Image
    name: cluster
    definition:
      spec:
        registrySources:
          insecureRegistries:
            - "{{ registry_host }}"

- name: Label the CXL workers
  kubernetes.core.k8s:
    state: patched
    kubeconfig: "{{ kubeconfig_path }}"
    kind: Node
    name: "{{ item.name }}"
    definition:
      metadata:
        labels: "{{ {'node-role.kubernetes.io/' ~ mco_cxl_role_label: ''} }}"
  loop: "{{ cxl_workers }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create the worker-cxl MachineConfigPool
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    api_version: machineconfiguration.openshift.io/v1
    kind: MachineConfigPool
    name: "{{ mco_cxl_mcp_name }}"
    definition:
      spec:
        machineConfigSelector:
          matchExpressions:
            - key: machineconfiguration.openshift.io/role
              operator: In
              values:
                - worker
                - "{{ mco_cxl_role_label }}"
        nodeSelector:
          matchLabels: "{{ {'node-role.kubernetes.io/' ~ mco_cxl_role_label: ''} }}"

- name: Create the osImageURL MachineConfig
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    api_version: machineconfiguration.openshift.io/v1
    kind: MachineConfig
    name: "{{ mco_cxl_osimage_mc_name }}"
    definition:
      metadata:
        labels:
          machineconfiguration.openshift.io/role: "{{ mco_cxl_role_label }}"
      spec:
        osImageURL: "{{ mco_cxl_osimage_url }}"

- name: Wait for the layered image rollout to land on every CXL worker
  # One poller over the whole fleet (fleet-parallel discipline). The pool's
  # Updated condition alone races the pivot: a freshly labeled node takes a
  # beat before the controller flips the condition to Updating, so a
  # condition wait can return on a stale Updated=True. The booted kernel is
  # the ground truth.
  ansible.builtin.shell: |
    set -o pipefail
    expected="{{ kernel_rpm_release }}"
    lines=$("{{ install_bin_dir }}/oc" get nodes \
      -o 'jsonpath={range .items[*]}{.metadata.name}{" "}{.status.nodeInfo.kernelVersion}{"\n"}{end}' \
      2>/dev/null | grep -E '^({{ cxl_workers | map(attribute='name') | join('|') }}) ' || true)
    if [ "$(printf '%s' "${lines}" | grep -c .)" -lt {{ cxl_workers | length }} ]; then
      echo "some CXL workers are not in the node list yet" >&2
      exit 1
    fi
    bad=$(printf '%s\n' "${lines}" | awk -v k="${expected}" '$2 != k {print $1"="$2}' | grep . || true)
    if [ -n "${bad}" ]; then
      echo "not yet on ${expected}: ${bad}" >&2
      exit 1
    fi
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: mco_cxl_rollout
  until: mco_cxl_rollout.rc == 0
  retries: "{{ mco_cxl_rollout_retries }}"
  delay: "{{ mco_cxl_rollout_delay_seconds }}"
  changed_when: false

- name: Read the booted kernel versions
  ansible.builtin.command:
    argv:
      - "{{ install_bin_dir }}/oc"
      - get
      - "node/{{ item.name }}"
      - "-o"
      - "jsonpath={.status.nodeInfo.kernelVersion}"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  loop: "{{ cxl_workers }}"
  loop_control:
    label: "{{ item.name }}"
  register: mco_cxl_kernels
  changed_when: false

- name: Assert every CXL worker boots the cxltest kernel
  ansible.builtin.assert:
    that:
      - item.stdout == kernel_rpm_release
    fail_msg: >-
      {{ item.item.name }} booted '{{ item.stdout }}', expected
      '{{ kernel_rpm_release }}' — the layered image rollout did not land.
  loop: "{{ mco_cxl_kernels.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: MCO rollout summary
  ansible.builtin.debug:
    msg: >-
      mco_cxl OK — every CXL worker on {{ kernel_rpm_release }} via
      {{ mco_cxl_osimage_url.split('@')[0] }}@{{ mco_cxl_osimage_url.split('@')[1][:19] }}…
      (pool {{ mco_cxl_mcp_name }} Updated).
