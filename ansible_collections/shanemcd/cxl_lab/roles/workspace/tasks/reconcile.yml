---
# A metadata-only repair, including outputs made by rootful subprocesses.
# Never enter the NFS export/PVC tree or a still-running QEMU builder.
- name: Keep existing lab artifacts accessible to the workspace owner
  shanemcd.cxl_lab.workspace_ownership:
    home: "{{ lab_user_home }}"
    uid: "{{ lab_workspace_identity.uid }}"
    gid: "{{ lab_workspace_identity.gid }}"
    roots:
      - "{{ install_dir }}"
      - "{{ vm_assets_dir }}"
      - "{{ artifacts_local_cache_dir }}"
      - "{{ kubeconfig_controller_path | dirname }}"
    private_roots:
      - "{{ install_dir }}"
      - "{{ vm_ignition_dir }}"
      - "{{ kubeconfig_controller_path | dirname }}"
    exclude: >-
      {{ [storage_export_dir] +
         ([qemu_build_dir] if qemu_builder_build_in_flight | default(false) else []) }}
  tags: [always]
