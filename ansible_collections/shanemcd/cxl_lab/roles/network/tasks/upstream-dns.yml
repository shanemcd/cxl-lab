---
- name: Set pinned upstream resolvers
  when: upstream_dns_servers | length > 0
  ansible.builtin.set_fact:
    network_upstream_dns: "{{ upstream_dns_servers }}"

- name: Auto-detect upstream resolvers from the lab host
  when: upstream_dns_servers | length == 0
  block:

    - name: Read the host resolver configuration
      ansible.builtin.command:
        cmd: "cat {{ network_dns_resolv_conf_path }}"
      register: network_dns_resolv_raw
      changed_when: false

    - name: Set host nameservers fact
      ansible.builtin.set_fact:
        network_dns_resolv_nameservers: >-
          {{ network_dns_resolv_raw.stdout_lines
             | select('match', '^\s*nameserver\s+\S+') | list
             | map('regex_replace', '^\s*nameserver\s+', '') | map('trim') | list }}

    - name: Set upstream candidates fact (resolv.conf minus loopbacks, the lab subnet, and blocklisted split-horizon resolvers)
      ansible.builtin.set_fact:
        network_dns_candidates: >-
          {{ network_dns_resolv_nameservers
             | reject('in', network_dns_loopback_addresses)
             | reject('in', upstream_dns_blocklist | default([]))
             | reject('search', '^' ~ (lab_subnet_prefix | regex_escape) ~ '\.')
             | unique | list }}

    - name: Set local resolver stub fact
      ansible.builtin.set_fact:
        network_dns_stub_list: >-
          {{ network_dns_resolv_nameservers
             | select('in', network_dns_loopback_addresses) | list }}

    - name: Read systemd-resolved upstreams
      when: network_dns_candidates | length == 0
      ansible.builtin.command:
        cmd: resolvectl dns
      register: network_dns_resolved_raw
      changed_when: false
      failed_when: false

    - name: Set detected upstream resolvers fact
      ansible.builtin.set_fact:
        network_upstream_dns: "{{ network_dns_candidates }}"

    - name: Fall back to systemd-resolved upstreams
      when: network_upstream_dns | length == 0
      ansible.builtin.set_fact:
        network_upstream_dns: >-
          {{ (network_dns_resolved_raw.stdout | default(''))
             | regex_findall(network_dns_ipv4_pattern)
             | reject('in', upstream_dns_blocklist | default([]))
             | reject('search', '^' ~ (lab_subnet_prefix | regex_escape) ~ '\.')
             | unique | list }}

    - name: Fall back to the host's local resolver stub
      when:
        - network_upstream_dns | length == 0
        - network_dns_stub_list | length > 0
      ansible.builtin.set_fact:
        network_upstream_dns: "{{ [network_dns_stub_list[0]] }}"

    - name: Assert upstream resolvers were determined
      ansible.builtin.assert:
        that:
          - network_upstream_dns | length > 0
        fail_msg: >-
          upstream_dns_servers is empty and no upstream resolvers could be
          auto-detected from the lab host (resolv.conf nameservers,
          systemd-resolved upstreams, local stub). Pin upstream_dns_servers
          in the network taxonomy.
