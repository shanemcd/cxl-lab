---
# layered_image: build the bootc layered OS image — base = the
# taxonomy-pinned payload machine-os-content ref (cross-validated against
# the master's booted osImageURL by the install role; on the MCO path also
# asserted build-side here), verify + bake the five cxltest kernel RPMs,
# regenerate the initramfs post-override, bootc lint, then EITHER push to
# the lab registry + fetch the AUTHORITATIVE Docker-Content-Digest with
# full OCI Accept headers + teach the cluster to trust the registry (MCO
# path) OR bake a bootable qcow2 via bootc-image-builder patched for
# first-boot ignition (pre-baked path).

# Build-side base-pin cross-check: REMOVED. The image stage now runs
# before the cluster exists, so there is nothing live to compare against;
# the cluster_install role performs the authoritative pin assert against
# the booted cluster (same machine_os_content_ref pin from versions.yml).

- name: Set the base image reference fact
  ansible.builtin.set_fact:
    layered_image_base_ref: "{{ machine_os_content_ref }}"

- name: Verify all built kernel RPMs against SHA256SUMS
  ansible.builtin.command:
    argv:
      - sha256sum
      - "-c"
      - "{{ layered_image_sha256sums_name }}"
    chdir: "{{ artifacts_kernel_rpms_dir }}"
  register: layered_image_rpms_check
  changed_when: false

- name: Ensure the image build context
  ansible.builtin.file:
    path: "{{ layered_image_build_dir }}"
    state: directory
    mode: "0700"

- name: Render the layered image Containerfile
  ansible.builtin.template:
    src: Containerfile.j2
    dest: "{{ layered_image_build_dir }}/Containerfile"
    mode: "0600"

- name: Stage the cxltest kernel RPMs in the build context
  ansible.builtin.copy:
    src: "{{ artifacts_kernel_rpms_dir }}/{{ item }}-{{ kernel_rpm_release }}.rpm"
    dest: "{{ layered_image_build_dir }}/{{ item }}-{{ kernel_rpm_release }}.rpm"
    remote_src: true
    mode: "0644"
  loop: "{{ layered_image_kernel_pkgs }}"

- name: Check whether the layered image already exists
  containers.podman.podman_image_info:
    name: "{{ layered_image_local_ref }}"
  register: layered_image_local_info

- name: Build the layered OS image
  when: layered_image_local_info.images | length == 0
  block:

    - name: Build the bootc layered image
      containers.podman.podman_image:
        name: "{{ layered_image_local_ref }}"
        state: build
        path: "{{ layered_image_build_dir }}"
        authfile: "{{ pull_secret_path }}"
      environment:
        REGISTRY_AUTH_FILE: "{{ pull_secret_path }}"

    - name: Remove any stale bootc lint container
      containers.podman.podman_container:
        name: "{{ layered_image_lint_container }}"
        state: absent

    - name: Run the bootc lint container
      containers.podman.podman_container:
        name: "{{ layered_image_lint_container }}"
        image: "{{ layered_image_local_ref }}"
        state: started
        entrypoint: sleep
        command: infinity

    - name: Run bootc container lint
      containers.podman.podman_container_exec:
        name: "{{ layered_image_lint_container }}"
        command: "/usr/bin/bootc container lint"
      register: layered_image_lint
      failed_when: false
      changed_when: false

    - name: Assert bootc container lint passes
      ansible.builtin.assert:
        that:
          - layered_image_lint.rc == 0
        fail_msg: >-
          bootc container lint failed (rc={{ layered_image_lint.rc }}):
          {{ layered_image_lint.stderr | default('') | trim }}
          {{ layered_image_lint.stdout | default('') | trim }}

    - name: Remove the bootc lint container
      containers.podman.podman_container:
        name: "{{ layered_image_lint_container }}"
        state: absent

- name: Assert the layered image exists
  containers.podman.podman_image_info:
    name: "{{ layered_image_local_ref }}"
  register: layered_image_local_info_final

- name: Assert layered image presence
  ansible.builtin.assert:
    that:
      - layered_image_local_info_final.images | length == 1
    fail_msg: "Layered image {{ layered_image_local_ref }} not found."

# --- Registry path (MCO rollout flow) --------------------------------------
# Only needed when the cluster pulls the layered image via the MCO. The
# pre-baked path consumes the image locally through BIB instead.

- name: Handle the lab registry flow
  # Both flows push the layered image to the lab registry and stamp the
  # authoritative Docker-Content-Digest: the MCO path pivots workers onto
  # the registry reference at 08, and the pre-baked path points the
  # install-time osImageURL MachineConfig at it (OpenShift's firstboot
  # pivot must land somewhere — make it land on the layered image).
  block:

    - name: Check the authoritative digest stamp
      ansible.builtin.stat:
        path: "{{ layered_image_digest_stamp_path }}"
      register: layered_image_stamp_stat

    - name: Read the authoritative digest stamp
      ansible.builtin.slurp:
        src: "{{ layered_image_digest_stamp_path }}"
      register: layered_image_stamp_raw
      when: layered_image_stamp_stat.stat.exists

    - name: Check whether the registry already holds this image
      ansible.builtin.uri:
        url: "{{ layered_image_manifest_url }}"
        method: HEAD
        headers:
          Accept: "{{ layered_image_manifest_accept | trim }}"
        status_code:
          - 200
          - 404
      register: layered_image_registry_manifest
      changed_when: false

    - name: Set the registry digest fact from the manifest probe
      ansible.builtin.set_fact:
        layered_image_registry_digest_present: >-
          {{ layered_image_registry_manifest.docker_content_digest | default('') | trim }}

    - name: Set the push need fact
      ansible.builtin.set_fact:
        layered_image_push_needed: >-
          {{ layered_image_registry_manifest.status == 404
             or not layered_image_stamp_stat.stat.exists
             or layered_image_registry_digest_present
            != (layered_image_stamp_raw.content | default('') | b64decode | trim) }}

    - name: Push the layered image to the lab registry
      when: layered_image_push_needed | bool
      containers.podman.podman_image:
        name: "{{ layered_image_local_ref }}"
        state: present
        push: true
        tls_verify: false
        push_args:
          dest: "{{ layered_image_registry_ref }}"

    - name: Fetch the authoritative Docker-Content-Digest
      ansible.builtin.uri:
        url: "{{ layered_image_manifest_url }}"
        method: HEAD
        headers:
          Accept: "{{ layered_image_manifest_accept | trim }}"
        status_code: 200
      register: layered_image_digest_fetch
      changed_when: false

    - name: Set the authoritative digest fact
      ansible.builtin.set_fact:
        layered_image_registry_digest: >-
          {{ layered_image_digest_fetch.docker_content_digest | default('') | trim }}

    - name: Assert the authoritative digest format
      ansible.builtin.assert:
        that:
          - layered_image_registry_digest is match('^sha256:[0-9a-f]{64}$')
        fail_msg: >-
          Registry did not return a Docker-Content-Digest for
          {{ layered_image_registry_ref }} (got
          '{{ layered_image_registry_digest }}').

    - name: Write the authoritative digest stamp
      ansible.builtin.copy:
        content: "{{ layered_image_registry_digest }}\n"
        dest: "{{ layered_image_digest_stamp_path }}"
        mode: "0600"
      when: layered_image_push_needed | bool

    - name: Verify pull-by-digest resolves to the built image
      when: layered_image_push_needed | bool
      containers.podman.podman_image:
        name: "{{ registry_host }}/{{ layered_image_name }}@{{ layered_image_registry_digest }}"
        state: present
        tls_verify: false

    - name: Read the pulled digest image
      when: layered_image_push_needed | bool
      containers.podman.podman_image_info:
        name: "{{ registry_host }}/{{ layered_image_name }}@{{ layered_image_registry_digest }}"
      register: layered_image_pulled_info

    - name: Assert pull-by-digest matches the built image
      when: layered_image_push_needed | bool
      ansible.builtin.assert:
        that:
          - layered_image_pulled_info.images | length == 1
          - >-
            layered_image_pulled_info.images[0].Id
            == layered_image_local_info_final.images[0].Id
        fail_msg: >-
          Pull-by-digest {{ layered_image_registry_digest }} did not resolve to the
          built image ({{ layered_image_local_info_final.images[0].Id }}) — the
          authoritative-digest handling regressed.

    - name: Untag the pulled digest reference
      when: layered_image_push_needed | bool
      containers.podman.podman_image:
        name: "{{ registry_host }}/{{ layered_image_name }}@{{ layered_image_registry_digest }}"
        state: absent

    - name: Layered image summary
      ansible.builtin.debug:
        msg: >-
          layered image OK — {{ layered_image_local_ref }} built from
          {{ layered_image_base_ref.split('@')[0] }}@{{ layered_image_base_ref.split('@')[1][:19] }}…,
          lint passed, pushed to {{ layered_image_registry_ref }}, authoritative
          digest {{ layered_image_registry_digest }} (podman RepoDigest
          {{ layered_image_local_info_final.images[0].RepoDigests | default([])
             | map('regex_replace', '^.*@', '') | join(',') }}
          differs by design).

# --- Pre-baked node image path ---------------------------------------------
# BIB turns the layered image into a bootable qcow2; the disk is patched for
# first-boot ignition (marker + platform karg + stripped generic root kargs)
# and the workers boot overlays of it (see the vms role). The registry still
# hosts the image: OpenShift's firstboot pivot rebases every node onto the
# cluster's osImageURL, so the pre-baked path aims that pivot at the layered
# image via an install-time MachineConfig (see the install_config role) —
# the pivot becomes a same-content rebase that keeps the cxltest kernel.
# No MCO rollout, no post-install MachineConfig churn.

- name: Build the pre-baked node image
  when: use_prebaked_node_images | bool
  block:

    - name: Ensure the node image build directory
      ansible.builtin.file:
        path: "{{ node_image_build_dir }}"
        state: directory
        mode: "0700"

    - name: Stat the BIB disk and the patch stamp
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ prebaked_node_image_path }}"
        - "{{ node_image_build_dir }}/{{ layered_image_bib_stamp_name }}"
      register: layered_image_bib_stat

    - name: Set the BIB disk path fact
      ansible.builtin.set_fact:
        layered_image_bib_disk: "{{ prebaked_node_image_path }}"

    - name: Run bootc-image-builder
      # Digest-pinned BIB from the versions taxonomy; the host container
      # storage is mounted so the freshly built layered image resolves
      # locally (no registry round-trip).
      when: not layered_image_bib_stat.results[0].stat.exists
      ansible.builtin.command:
        argv:
          - podman
          - run
          - "--privileged"
          - "--rm"
          - "-v"
          - /var/lib/containers/storage:/var/lib/containers/storage
          - "-v"
          - "{{ node_image_build_dir }}:/output"
          - "{{ bootc_image_builder_image }}"
          - "--type"
          - qcow2
          - "--rootfs"
          - "{{ layered_image_bib_rootfs }}"
          - "{{ layered_image_local_ref }}"
      register: layered_image_bib_build
      changed_when: true

    - name: Patch the BIB disk for first-boot ignition
      # Runs when the disk is fresh OR the stamp is missing (interrupted
      # run); the seds and marker touch are idempotent.
      when: >-
        not layered_image_bib_stat.results[0].stat.exists
        or not layered_image_bib_stat.results[1].stat.exists
      ansible.builtin.shell: |
        set -euo pipefail
        disk="{{ layered_image_bib_disk }}"
        dev="/dev/nbd{{ layered_image_bib_nbd_device }}"
        modprobe nbd max_part=8
        qemu-nbd --disconnect "${dev}" 2>/dev/null || true
        qemu-nbd --connect="${dev}" "${disk}"
        for _ in $(seq 1 {{ layered_image_bib_nbd_settle_retries }}); do
          sleep {{ layered_image_bib_nbd_settle_delay }}
          partprobe "${dev}" 2>/dev/null || true
          udevadm settle 2>/dev/null || true
          bootpart="$(lsblk -rno NAME,LABEL "${dev}" \
            | awk '$1 ~ /nbd/ && $2 == "boot" {print $1}' | head -1)"
          [ -n "${bootpart}" ] && break
        done
        [ -n "${bootpart}" ] || { echo "no boot-labeled partition on ${dev}" >&2; exit 1; }
        mount "/dev/${bootpart}" /mnt
        trap 'umount /mnt; qemu-nbd --disconnect "${dev}"' EXIT
        for bls in /mnt/loader/entries/ostree-*.conf; do
          sed -i -E 's/root=UUID=[0-9a-f-]+ //g; s/boot=UUID=[0-9a-f-]+ //g' "${bls}"
          sed -i -E 's/rootflags=[^ ]+ //g; s/(^|[ ])rw([ ]|$)/ /g' "${bls}"
          grep -q 'ignition.platform.id=' "${bls}" \
            || sed -i 's/^options /options {{ layered_image_bib_platform_karg }} /' "${bls}"
          # The stock BLS references the ignition_firstboot grub variable,
          # expanded by the marker-file conditional in grub.cfg; BIB drops
          # the reference, so re-add it. See layered_image defaults for the
          # full mechanism.
          grep -q '\$ignition_firstboot' "${bls}" \
            || sed -i 's/^options /options rw \$ignition_firstboot /' "${bls}"
          grep -q ' ostree=' "${bls}" \
            || { echo "${bls} lost its ostree= karg" >&2; exit 1; }
          grep -q 'root=' "${bls}" \
            && { echo "${bls} still carries a root= karg" >&2; exit 1; }
        done
        touch /mnt/{{ layered_image_bib_ignition_firstboot_marker }}
        printf '%s kernel=%s patched=%s\n' \
          '{{ layered_image_local_ref }}' '{{ kernel_rpm_release }}' \
          "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          > "{{ node_image_build_dir }}/{{ layered_image_bib_stamp_name }}"
        echo "BIB disk patched: $(ls /mnt/loader/entries/ostree-*.conf \
          | wc -l) BLS entry(ies) fixed, firstboot marker armed"
      register: layered_image_bib_patch
      changed_when: true

    - name: Assert the BIB disk exists
      ansible.builtin.stat:
        path: "{{ layered_image_bib_disk }}"
      register: layered_image_bib_disk_stat

    - name: Assert the BIB disk presence
      ansible.builtin.assert:
        that:
          - layered_image_bib_disk_stat.stat.exists
        fail_msg: >-
          Pre-baked node image missing at {{ layered_image_bib_disk }} —
          the BIB build did not produce a disk.

    - name: Pre-baked image summary
      ansible.builtin.debug:
        msg: >-
          pre-baked node image OK — {{ layered_image_local_ref }} built from
          {{ layered_image_base_ref.split('@')[0] }}@{{ layered_image_base_ref.split('@')[1][:19] }}…
          (lint passed, initramfs regenerated post-override), BIB qcow2 at
          {{ layered_image_bib_disk }} patched for first-boot ignition
          (generic root kargs stripped, {{ layered_image_bib_platform_karg }},
          {{ layered_image_bib_ignition_firstboot_marker }} marker armed).
