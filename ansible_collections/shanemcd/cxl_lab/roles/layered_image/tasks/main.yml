---
# layered_image: build the cxltest kernel RPMs (in-container, from the
# SRPM, when the RPM cache is missing) + the bootc layered OS image —
# base = the taxonomy-pinned payload machine-os-content ref
# (cross-validated against the master's booted osImageURL by the install
# role), verify + bake the five cxltest kernel RPMs, regenerate the
# initramfs post-override, bootc lint, then bake a bootable qcow2 via
# bootc-image-builder patched for first-boot ignition.

# Build-side base-pin cross-check: REMOVED. The image stage now runs
# before the cluster exists, so there is nothing live to compare against;
# the cluster_install role performs the authoritative pin assert against
# the booted cluster (same machine_os_content_ref pin from versions.yml).

- name: Set the base image reference fact
  ansible.builtin.set_fact:
    layered_image_base_ref: "{{ machine_os_content_ref }}"

# --- cxltest kernel RPMs: build if missing, verify always ------------------
# The RPMs are built INSIDE this image build (multi-stage Containerfile,
# kernel-builder stage in the RHEL 10 GA builder image) and exported to the
# teardown-protected artifacts dir. The build input is the SHA-verified
# SRPM downloaded by the artifacts role.

- name: Set expected kernel RPM file names
  ansible.builtin.set_fact:
    layered_image_expected_kernel_rpms: >-
      {{ layered_image_kernel_pkgs
         | map('regex_replace', '$', '-' ~ kernel_rpm_release ~ '.rpm') | list }}

- name: Stat expected kernel RPMs
  ansible.builtin.stat:
    path: "{{ artifacts_kernel_rpms_dir }}/{{ item }}"
  loop: "{{ layered_image_expected_kernel_rpms }}"
  register: layered_image_kernel_rpms_stat

- name: Set kernel RPMs presence fact
  ansible.builtin.set_fact:
    layered_image_kernel_rpms_present: >-
      {{ layered_image_kernel_rpms_stat.results | selectattr('stat.exists') | list | length
         == layered_image_expected_kernel_rpms | length }}

- name: Build the cxltest kernel RPMs in the image build
  when: not layered_image_kernel_rpms_present
  block:

    - name: Stat the kernel SRPM
      # Downloaded + sha-verified by the artifacts role; re-verified here
      # because it is this build's input contract.
      ansible.builtin.stat:
        path: "{{ artifacts_srpm_dir }}/{{ kernel_srpm_nvr }}.src.rpm"
        checksum_algorithm: sha256
      register: layered_image_srpm_stat

    - name: Assert the kernel SRPM is present and matches the pin
      ansible.builtin.assert:
        that:
          - layered_image_srpm_stat.stat.exists
          - >-
            layered_image_srpm_stat.stat.checksum == kernel_srpm_sha256
        fail_msg: >-
          Kernel SRPM {{ kernel_srpm_nvr }}.src.rpm missing or checksum mismatch in
          {{ artifacts_srpm_dir }} — run the artifacts stage first, or fix the pin
          in versions.yml.

    - name: Discover the host RHSM entitlement key
      ansible.builtin.find:
        paths: "{{ rhsm_entitlement_dir }}"
        patterns: '*-key.pem'
      register: layered_image_entitlement_keys

    - name: Assert exactly one entitlement key exists
      ansible.builtin.assert:
        that:
          - layered_image_entitlement_keys.files | length == 1
        fail_msg: >-
          Expected exactly one entitlement key in {{ rhsm_entitlement_dir }},
          found {{ layered_image_entitlement_keys.files | length }} — the
          kernel-builder build needs the host RHSM entitlement for CDN access.

    - name: Set the entitlement certificate facts
      ansible.builtin.set_fact:
        layered_image_entitlement_key: "{{ layered_image_entitlement_keys.files[0].path }}"
        layered_image_entitlement_cert: >-
          {{ layered_image_entitlement_keys.files[0].path | regex_replace('-key\.pem$', '.pem') }}

    - name: Stat the RHSM CA file
      ansible.builtin.stat:
        path: "{{ rhsm_ca_dir }}/redhat-uep.pem"
      register: layered_image_rhsm_ca_stat

    - name: Assert the RHSM CA file exists
      ansible.builtin.assert:
        that:
          - layered_image_rhsm_ca_stat.stat.exists
        fail_msg: >-
          {{ rhsm_ca_dir }}/redhat-uep.pem missing — the kernel-builder build
          needs the host's RHSM CA (is the host registered?).

    - name: Set the RHSM CA fact
      ansible.builtin.set_fact:
        layered_image_rhsm_ca_file: "{{ rhsm_ca_dir }}/redhat-uep.pem"

    - name: Ensure the kernel-builder build context
      ansible.builtin.file:
        path: "{{ layered_image_kernel_ctx_dir }}"
        state: directory
        mode: "0700"

    - name: Stage the SRPM in the kernel-builder context
      ansible.builtin.copy:
        src: "{{ artifacts_srpm_dir }}/{{ kernel_srpm_nvr }}.src.rpm"
        dest: "{{ layered_image_kernel_ctx_dir }}/{{ kernel_srpm_nvr }}.src.rpm"
        remote_src: true
        mode: "0644"

    - name: Render the CDN binary repo file
      ansible.builtin.template:
        src: kernel-builder-repos.repo.j2
        dest: "{{ layered_image_kernel_ctx_dir }}/{{ layered_image_builder_repos_name }}"
        mode: "0600"

    - name: Render the kernel-builder Containerfile
      # Same template as the layered image build; the kernel stages are
      # rendered only for this invocation (the image build renders without
      # them so a cold layer cache can never re-trigger a kernel rebuild
      # when the on-disk RPM cache is warm).
      ansible.builtin.template:
        src: Containerfile.j2
        dest: "{{ layered_image_kernel_ctx_dir }}/Containerfile"
        mode: "0600"
      vars:
        layered_image_render_kernel_stage: true

    - name: Build and export the kernel RPMs
      # One blocking invocation: kernel-builder stage (deps converge loop +
      # baseonly rpmbuild, ~25 min cold) + kernel-rpms scratch stage, whose
      # filesystem — just the RPMs — lands in the artifacts dir via --output.
      ansible.builtin.command:
        argv:
          - podman
          - build
          - --authfile
          - "{{ pull_secret_path }}"
          - --security-opt
          - label=disable
          - --volume
          - "{{ rhsm_entitlement_dir }}:{{ rhsm_entitlement_dir }}:ro"
          - --volume
          - "{{ rhsm_ca_dir }}:{{ rhsm_ca_dir }}:ro"
          - --target
          - kernel-rpms
          - --output
          - "type=local,dest={{ artifacts_kernel_rpms_dir }}"
          - "{{ layered_image_kernel_ctx_dir }}"
      register: layered_image_kernel_build
      changed_when: true

    - name: Prune the kernel-build intermediate images
      # buildah keeps the multi-stage intermediate layers as dangling
      # images — several GB per kernel build. Without this, a cold run's
      # build products push a subsequent run's disk-budget gate over the
      # edge. Tagged images (builder base, payload base, layered image) are
      # never dangling, so the prune cannot touch them.
      ansible.builtin.command:
        argv:
          - podman
          - image
          - prune
          - "-f"
      register: layered_image_kernel_build_prune
      changed_when: layered_image_kernel_build_prune.stdout | trim | length > 0

- name: Stat expected kernel RPMs after the build
  ansible.builtin.stat:
    path: "{{ artifacts_kernel_rpms_dir }}/{{ item }}"
  loop: "{{ layered_image_expected_kernel_rpms }}"
  register: layered_image_kernel_rpms_stat_final

- name: Assert expected kernel RPMs exist
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: "Missing kernel RPM {{ item.item }} in {{ artifacts_kernel_rpms_dir }}."
  loop: "{{ layered_image_kernel_rpms_stat_final.results }}"

- name: Extract the kernel-core config for verification
  ansible.builtin.shell: |
    set -o pipefail
    rm -rf "{{ layered_image_cfgcheck_dir }}"
    mkdir -p "{{ layered_image_cfgcheck_dir }}"
    cd "{{ layered_image_cfgcheck_dir }}"
    rpm2cpio "{{ artifacts_kernel_rpms_dir }}/kernel-core-{{ kernel_rpm_release }}.rpm" | cpio -idm --quiet
    find . -type f -name config -path '*modules*'
  changed_when: false
  register: layered_image_kernel_cfg_find

- name: Set kernel-core config path fact
  ansible.builtin.set_fact:
    layered_image_kernel_cfg_path: >-
      {{ layered_image_cfgcheck_dir }}/{{ layered_image_kernel_cfg_find.stdout_lines | first }}

- name: Read the kernel-core config
  ansible.builtin.slurp:
    src: "{{ layered_image_kernel_cfg_path }}"
  register: layered_image_kernel_cfg_raw

- name: Set kernel-core config lines fact
  ansible.builtin.set_fact:
    layered_image_kernel_cfg_lines: "{{ layered_image_kernel_cfg_raw.content | b64decode | trim | split('\n') }}"

- name: Assert the cxltest kernel config in kernel-core
  ansible.builtin.assert:
    that:
      - item in layered_image_kernel_cfg_lines
    fail_msg: "Required kernel config line {{ item }} missing from kernel-core."
  loop: "{{ layered_image_required_kernel_config }}"

- name: Compute SHA256SUMS for the kernel RPMs
  ansible.builtin.command:
    cmd: "sha256sum {{ layered_image_expected_kernel_rpms | join(' ') }}"
    chdir: "{{ artifacts_kernel_rpms_dir }}"
  register: layered_image_kernel_sums
  changed_when: false

- name: Write SHA256SUMS (idempotent)
  ansible.builtin.copy:
    content: "{{ layered_image_kernel_sums.stdout }}"
    dest: "{{ artifacts_kernel_rpms_dir }}/{{ layered_image_sha256sums_name }}"
    mode: "0644"

- name: Verify all built kernel RPMs against SHA256SUMS
  ansible.builtin.command:
    argv:
      - sha256sum
      - "-c"
      - "{{ layered_image_sha256sums_name }}"
    chdir: "{{ artifacts_kernel_rpms_dir }}"
  register: layered_image_rpms_check
  changed_when: false

- name: Ensure the image build context
  ansible.builtin.file:
    path: "{{ layered_image_build_dir }}"
    state: directory
    mode: "0700"

- name: Render the layered image Containerfile
  ansible.builtin.template:
    src: Containerfile.j2
    dest: "{{ layered_image_build_dir }}/Containerfile"
    mode: "0600"

- name: Stage the cxltest kernel RPMs in the build context
  ansible.builtin.copy:
    src: "{{ artifacts_kernel_rpms_dir }}/{{ item }}-{{ kernel_rpm_release }}.rpm"
    dest: "{{ layered_image_build_dir }}/{{ item }}-{{ kernel_rpm_release }}.rpm"
    remote_src: true
    mode: "0644"
  loop: "{{ layered_image_kernel_pkgs }}"

- name: Check whether the layered image already exists
  containers.podman.podman_image_info:
    name: "{{ layered_image_local_ref }}"
  register: layered_image_local_info

- name: Build the layered OS image
  when: layered_image_local_info.images | length == 0
  block:

    - name: Build the bootc layered image
      containers.podman.podman_image:
        name: "{{ layered_image_local_ref }}"
        state: build
        path: "{{ layered_image_build_dir }}"
        authfile: "{{ pull_secret_path }}"
      environment:
        REGISTRY_AUTH_FILE: "{{ pull_secret_path }}"

    - name: Remove any stale bootc lint container
      containers.podman.podman_container:
        name: "{{ layered_image_lint_container }}"
        state: absent

    - name: Run the bootc lint container
      containers.podman.podman_container:
        name: "{{ layered_image_lint_container }}"
        image: "{{ layered_image_local_ref }}"
        state: started
        entrypoint: sleep
        command: infinity

    - name: Run bootc container lint
      containers.podman.podman_container_exec:
        name: "{{ layered_image_lint_container }}"
        command: "/usr/bin/bootc container lint"
      register: layered_image_lint
      failed_when: false
      changed_when: false

    - name: Assert bootc container lint passes
      ansible.builtin.assert:
        that:
          - layered_image_lint.rc == 0
        fail_msg: >-
          bootc container lint failed (rc={{ layered_image_lint.rc }}):
          {{ layered_image_lint.stderr | default('') | trim }}
          {{ layered_image_lint.stdout | default('') | trim }}

    - name: Remove the bootc lint container
      containers.podman.podman_container:
        name: "{{ layered_image_lint_container }}"
        state: absent

- name: Assert the layered image exists
  containers.podman.podman_image_info:
    name: "{{ layered_image_local_ref }}"
  register: layered_image_local_info_final

- name: Assert layered image presence
  ansible.builtin.assert:
    that:
      - layered_image_local_info_final.images | length == 1
    fail_msg: "Layered image {{ layered_image_local_ref }} not found."

# --- Node image path --------------------------------------------------------
# BIB turns the layered image into a bootable qcow2; the disk is patched for
# first-boot ignition (marker + platform karg + stripped generic root kargs)
# and the workers boot overlays of it (see the vms role). OpenShift's
# firstboot OS check compares each node's booted image ref against its
# pool's osImageURL — the worker-cxl pool's osImageURL MachineConfig
# (install-time, see the install_config role) carries this image's local
# ref, so the check matches and no pivot ever fires. No MCO rollout, no
# post-install MachineConfig churn.

- name: Build the pre-baked node image
  block:

    - name: Stat the BIB disk and the patch stamp
      # The build directory itself is ensured by host_prep's workspace
      # list (0755) — no per-role duplicate (a second ensure with a
      # different mode would fight it every run).
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ prebaked_node_image_path }}"
        - "{{ node_image_build_dir }}/{{ layered_image_bib_stamp_name }}"
      register: layered_image_bib_stat

    - name: Set the BIB disk path fact
      ansible.builtin.set_fact:
        layered_image_bib_disk: "{{ prebaked_node_image_path }}"

    - name: Run bootc-image-builder
      # Digest-pinned BIB from the versions taxonomy; the host container
      # storage is mounted so the freshly built layered image resolves
      # locally.
      when: not layered_image_bib_stat.results[0].stat.exists
      ansible.builtin.command:
        argv:
          - podman
          - run
          - "--privileged"
          - "--rm"
          - "-v"
          - /var/lib/containers/storage:/var/lib/containers/storage
          - "-v"
          - "{{ node_image_build_dir }}:/output"
          - "{{ bootc_image_builder_image }}"
          - "--type"
          - qcow2
          - "--rootfs"
          - "{{ layered_image_bib_rootfs }}"
          - "{{ layered_image_local_ref }}"
      register: layered_image_bib_build
      changed_when: true

    - name: Patch the BIB disk for first-boot ignition
      # Runs when the disk is fresh OR the stamp is missing (interrupted
      # run); the seds and marker touch are idempotent.
      when: >-
        not layered_image_bib_stat.results[0].stat.exists
        or not layered_image_bib_stat.results[1].stat.exists
      ansible.builtin.shell: |
        set -euo pipefail
        disk="{{ layered_image_bib_disk }}"
        dev="/dev/nbd{{ layered_image_bib_nbd_device }}"
        modprobe nbd max_part=8
        qemu-nbd --disconnect "${dev}" 2>/dev/null || true
        qemu-nbd --connect="${dev}" "${disk}"
        for _ in $(seq 1 {{ layered_image_bib_nbd_settle_retries }}); do
          sleep {{ layered_image_bib_nbd_settle_delay }}
          partprobe "${dev}" 2>/dev/null || true
          udevadm settle 2>/dev/null || true
          bootpart="$(lsblk -rno NAME,LABEL "${dev}" \
            | awk '$1 ~ /nbd/ && $2 == "boot" {print $1}' | head -1)"
          [ -n "${bootpart}" ] && break
        done
        [ -n "${bootpart}" ] || { echo "no boot-labeled partition on ${dev}" >&2; exit 1; }
        mount "/dev/${bootpart}" /mnt
        trap 'umount /mnt; qemu-nbd --disconnect "${dev}"' EXIT
        for bls in /mnt/loader/entries/ostree-*.conf; do
          sed -i -E 's/root=UUID=[0-9a-f-]+ //g; s/boot=UUID=[0-9a-f-]+ //g' "${bls}"
          sed -i -E 's/rootflags=[^ ]+ //g; s/(^|[ ])rw([ ]|$)/ /g' "${bls}"
          grep -q 'ignition.platform.id=' "${bls}" \
            || sed -i 's/^options /options {{ layered_image_bib_platform_karg }} /' "${bls}"
          # The stock BLS references the ignition_firstboot grub variable,
          # expanded by the marker-file conditional in grub.cfg; BIB drops
          # the reference, so re-add it. See layered_image defaults for the
          # full mechanism.
          grep -q '\$ignition_firstboot' "${bls}" \
            || sed -i 's/^options /options rw \$ignition_firstboot /' "${bls}"
          grep -q ' ostree=' "${bls}" \
            || { echo "${bls} lost its ostree= karg" >&2; exit 1; }
          grep -q 'root=' "${bls}" \
            && { echo "${bls} still carries a root= karg" >&2; exit 1; }
        done
        touch /mnt/{{ layered_image_bib_ignition_firstboot_marker }}
        printf '%s kernel=%s patched=%s\n' \
          '{{ layered_image_local_ref }}' '{{ kernel_rpm_release }}' \
          "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          > "{{ node_image_build_dir }}/{{ layered_image_bib_stamp_name }}"
        echo "BIB disk patched: $(ls /mnt/loader/entries/ostree-*.conf \
          | wc -l) BLS entry(ies) fixed, firstboot marker armed"
      register: layered_image_bib_patch
      changed_when: true

    - name: Assert the BIB disk exists
      ansible.builtin.stat:
        path: "{{ layered_image_bib_disk }}"
      register: layered_image_bib_disk_stat

    - name: Assert the BIB disk presence
      ansible.builtin.assert:
        that:
          - layered_image_bib_disk_stat.stat.exists
        fail_msg: >-
          Pre-baked node image missing at {{ layered_image_bib_disk }} —
          the BIB build did not produce a disk.

    - name: Pre-baked image summary
      ansible.builtin.debug:
        msg: >-
          pre-baked node image OK — {{ layered_image_local_ref }} built from
          {{ layered_image_base_ref.split('@')[0] }}@{{ layered_image_base_ref.split('@')[1][:19] }}…
          (lint passed, initramfs regenerated post-override), BIB qcow2 at
          {{ layered_image_bib_disk }} patched for first-boot ignition
          (generic root kargs stripped, {{ layered_image_bib_platform_karg }},
          {{ layered_image_bib_ignition_firstboot_marker }} marker armed).
