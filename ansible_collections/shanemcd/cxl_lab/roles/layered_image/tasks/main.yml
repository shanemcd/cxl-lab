---
# layered_image: build the bootc layered OS image — base = the
# taxonomy-pinned payload machine-os-content ref (cross-validated against
# the master's booted osImageURL by the install role), verify + bake the
# five cxltest kernel RPMs, bootc lint,
# push to the lab registry, fetch the AUTHORITATIVE Docker-Content-Digest
# with full OCI Accept headers, verify pull-by-digest, and teach the
# cluster to trust the registry.

- name: Read the master's current MachineConfig
  ansible.builtin.command:
    argv:
      - "{{ install_bin_dir }}/oc"
      - get
      - node
      - "{{ masters[0].name }}"
      - "-o"
      - "jsonpath={.metadata.annotations.machineconfiguration\\.openshift\\.io/currentConfig}"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: layered_image_current_mc
  changed_when: false

- name: Read the current MachineConfig osImageURL
  ansible.builtin.command:
    argv:
      - "{{ install_bin_dir }}/oc"
      - get
      - machineconfig
      - "{{ layered_image_current_mc.stdout | trim }}"
      - "-o"
      - "jsonpath={.spec.osImageURL}"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: layered_image_mc_osimage
  changed_when: false

- name: Assert the pinned base matches the booted cluster
  # The layered image must extend EXACTLY what the cluster runs, or the
  # MCO pivot mixes OS contents. The install role asserts the same pin —
  # this is the build-side half.
  ansible.builtin.assert:
    that:
      - layered_image_mc_osimage.stdout | trim == machine_os_content_ref
    fail_msg: >-
      The master's currentConfig MC osImageURL is
      {{ layered_image_mc_osimage.stdout | trim }} but versions.yml pins
      {{ machine_os_content_ref }} — the payload moved or the pin is
      stale; re-pin deliberately before building.

- name: Set the base image reference fact
  ansible.builtin.set_fact:
    layered_image_base_ref: "{{ machine_os_content_ref }}"

- name: Verify all built kernel RPMs against SHA256SUMS
  ansible.builtin.command:
    argv:
      - sha256sum
      - "-c"
      - "{{ layered_image_sha256sums_name }}"
    chdir: "{{ artifacts_kernel_rpms_dir }}"
  register: layered_image_rpms_check
  changed_when: false

- name: Ensure the image build context
  ansible.builtin.file:
    path: "{{ layered_image_build_dir }}"
    state: directory
    mode: "0700"

- name: Render the layered image Containerfile
  ansible.builtin.template:
    src: Containerfile.j2
    dest: "{{ layered_image_build_dir }}/Containerfile"
    mode: "0600"

- name: Stage the cxltest kernel RPMs in the build context
  ansible.builtin.copy:
    src: "{{ artifacts_kernel_rpms_dir }}/{{ item }}-{{ kernel_rpm_release }}.rpm"
    dest: "{{ layered_image_build_dir }}/{{ item }}-{{ kernel_rpm_release }}.rpm"
    remote_src: true
    mode: "0644"
  loop: "{{ layered_image_kernel_pkgs }}"

- name: Check whether the layered image already exists
  containers.podman.podman_image_info:
    name: "{{ layered_image_local_ref }}"
  register: layered_image_local_info

- name: Build the layered OS image
  when: layered_image_local_info.images | length == 0
  block:

    - name: Build the bootc layered image
      containers.podman.podman_image:
        name: "{{ layered_image_local_ref }}"
        state: build
        path: "{{ layered_image_build_dir }}"
        authfile: "{{ pull_secret_path }}"
      environment:
        REGISTRY_AUTH_FILE: "{{ pull_secret_path }}"

    - name: Remove any stale bootc lint container
      containers.podman.podman_container:
        name: "{{ layered_image_lint_container }}"
        state: absent

    - name: Run the bootc lint container
      containers.podman.podman_container:
        name: "{{ layered_image_lint_container }}"
        image: "{{ layered_image_local_ref }}"
        state: started
        entrypoint: sleep
        command: infinity

    - name: Run bootc container lint
      containers.podman.podman_container_exec:
        name: "{{ layered_image_lint_container }}"
        command: "/usr/bin/bootc container lint"
      register: layered_image_lint
      failed_when: false
      changed_when: false

    - name: Assert bootc container lint passes
      ansible.builtin.assert:
        that:
          - layered_image_lint.rc == 0
        fail_msg: >-
          bootc container lint failed (rc={{ layered_image_lint.rc }}):
          {{ layered_image_lint.stderr | default('') | trim }}
          {{ layered_image_lint.stdout | default('') | trim }}

    - name: Remove the bootc lint container
      containers.podman.podman_container:
        name: "{{ layered_image_lint_container }}"
        state: absent

- name: Assert the layered image exists
  containers.podman.podman_image_info:
    name: "{{ layered_image_local_ref }}"
  register: layered_image_local_info_final

- name: Assert layered image presence
  ansible.builtin.assert:
    that:
      - layered_image_local_info_final.images | length == 1
    fail_msg: "Layered image {{ layered_image_local_ref }} not found."

- name: Check the authoritative digest stamp
  ansible.builtin.stat:
    path: "{{ layered_image_digest_stamp_path }}"
  register: layered_image_stamp_stat

- name: Read the authoritative digest stamp
  ansible.builtin.slurp:
    src: "{{ layered_image_digest_stamp_path }}"
  register: layered_image_stamp_raw
  when: layered_image_stamp_stat.stat.exists

- name: Check whether the registry already holds this image
  ansible.builtin.uri:
    url: "{{ layered_image_manifest_url }}"
    method: HEAD
    headers:
      Accept: "{{ layered_image_manifest_accept | trim }}"
    status_code:
      - 200
      - 404
  register: layered_image_registry_manifest
  changed_when: false

- name: Set the registry digest fact from the manifest probe
  ansible.builtin.set_fact:
    layered_image_registry_digest_present: >-
      {{ layered_image_registry_manifest.docker_content_digest | default('') | trim }}

- name: Set the push need fact
  ansible.builtin.set_fact:
    layered_image_push_needed: >-
      {{ layered_image_registry_manifest.status == 404
         or not layered_image_stamp_stat.stat.exists
         or layered_image_registry_digest_present
            != (layered_image_stamp_raw.content | default('') | b64decode | trim) }}

- name: Push the layered image to the lab registry
  when: layered_image_push_needed | bool
  containers.podman.podman_image:
    name: "{{ layered_image_local_ref }}"
    state: present
    push: true
    tls_verify: false
    push_args:
      dest: "{{ layered_image_registry_ref }}"

- name: Fetch the authoritative Docker-Content-Digest
  ansible.builtin.uri:
    url: "{{ layered_image_manifest_url }}"
    method: HEAD
    headers:
      Accept: "{{ layered_image_manifest_accept | trim }}"
    status_code: 200
  register: layered_image_digest_fetch
  changed_when: false

- name: Set the authoritative digest fact
  ansible.builtin.set_fact:
    layered_image_registry_digest: >-
      {{ layered_image_digest_fetch.docker_content_digest | default('') | trim }}

- name: Assert the authoritative digest format
  ansible.builtin.assert:
    that:
      - layered_image_registry_digest is match('^sha256:[0-9a-f]{64}$')
    fail_msg: >-
      Registry did not return a Docker-Content-Digest for
      {{ layered_image_registry_ref }} (got
      '{{ layered_image_registry_digest }}').

- name: Write the authoritative digest stamp
  ansible.builtin.copy:
    content: "{{ layered_image_registry_digest }}\n"
    dest: "{{ layered_image_digest_stamp_path }}"
    mode: "0600"
  when: layered_image_push_needed | bool

- name: Verify pull-by-digest resolves to the built image
  when: layered_image_push_needed | bool
  containers.podman.podman_image:
    name: "{{ registry_host }}/{{ layered_image_name }}@{{ layered_image_registry_digest }}"
    state: present
    tls_verify: false

- name: Read the pulled digest image
  when: layered_image_push_needed | bool
  containers.podman.podman_image_info:
    name: "{{ registry_host }}/{{ layered_image_name }}@{{ layered_image_registry_digest }}"
  register: layered_image_pulled_info

- name: Assert pull-by-digest matches the built image
  when: layered_image_push_needed | bool
  ansible.builtin.assert:
    that:
      - layered_image_pulled_info.images | length == 1
      - >-
        layered_image_pulled_info.images[0].Id
        == layered_image_local_info_final.images[0].Id
    fail_msg: >-
      Pull-by-digest {{ layered_image_registry_digest }} did not resolve to the
      built image ({{ layered_image_local_info_final.images[0].Id }}) — the
      authoritative-digest handling regressed.

- name: Untag the pulled digest reference
  when: layered_image_push_needed | bool
  containers.podman.podman_image:
    name: "{{ registry_host }}/{{ layered_image_name }}@{{ layered_image_registry_digest }}"
    state: absent

- name: Teach the cluster to trust the lab registry
  kubernetes.core.k8s:
    state: patched
    kubeconfig: "{{ kubeconfig_path }}"
    api_version: config.openshift.io/v1
    kind: Image
    name: cluster
    definition:
      spec:
        registrySources:
          insecureRegistries:
            - "{{ registry_host }}"

- name: Layered image summary
  ansible.builtin.debug:
    msg: >-
      layered image OK — {{ layered_image_local_ref }} built from
      {{ layered_image_base_ref.split('@')[0] }}@{{ layered_image_base_ref.split('@')[1][:19] }}…,
      lint passed, pushed to {{ layered_image_registry_ref }}, authoritative
      digest {{ layered_image_registry_digest }} (podman RepoDigest
      {{ layered_image_local_info_final.images[0].RepoDigests | default([])
         | map('regex_replace', '^.*@', '') | join(',') }}
      differs by design), registry trusted cluster-wide.
