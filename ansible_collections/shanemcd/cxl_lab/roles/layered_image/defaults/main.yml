---
# layered_image role-scoped knobs; image name/tag/refs live in the versions
# taxonomy and the build dir in the paths taxonomy.
# The five boot-relevant cxltest kernel packages baked into the image
# (the artifacts role built and SHA256SUMS-verified them).
# kernel-modules-core is REQUIRED — it provides kernel-modules-core-uname-r
# that kernel/kernel-core/kernel-modules* depsolve against (kernel-devel is
# headers-only and not needed at runtime).
layered_image_kernel_pkgs:
  - kernel
  - kernel-core
  - kernel-modules
  - kernel-modules-core
  - kernel-modules-extra
layered_image_sha256sums_name: "SHA256SUMS"

# Throwaway lint runner.
layered_image_lint_container: "cxl-lab-bootc-lint"

# Full OCI Accept set for the manifest query (the authoritative
# digest is the registry's Docker-Content-Digest — podman's RepoDigest is a
# local serialization digest and pulling by it fails MANIFEST_UNKNOWN).
layered_image_manifest_accept: >-
  application/vnd.oci.image.manifest.v1+json,
  application/vnd.oci.image.index.v1+json,
  application/vnd.docker.distribution.manifest.v2+json,
  application/vnd.docker.distribution.manifest.list.v2+json
layered_image_manifest_url: "http://{{ registry_host }}/v2/{{ layered_image_name }}/manifests/{{ layered_image_tag }}"

# --- Pre-baked node images (use_prebaked_node_images) --------------------
# BIB turns the layered image into a bootable qcow2. The root filesystem
# type must be passed explicitly: the machine-os-content bootc image does
# not declare a default rootfs and this BIB generation refuses to guess.
layered_image_bib_rootfs: "xfs"
# First-boot arming + karg fixups applied to the BIB disk's BLS entries.
# BIB writes root=UUID/boot=UUID into the boot entries; with root= on the
# cmdline the generic root-mount path skips ostree-prepare-root, so /sysroot
# stays the raw rootfs (no top-level /etc on ostree "aleph" disks) and
# first-boot ignition dies creating users ("cannot lock /etc/group").
# Stock RHCOS disks boot with no root= karg — the ostree dracut module mounts
# root from ostree= and prepare-root publishes the deployment's /etc. The
# stock BLS entries also reference the $ignition_firstboot VARIABLE, which
# the grub 05_ignition.cfg snippet expands to the ignition.firstboot karg
# when the /boot/ignition.firstboot marker exists (removed by ignition after
# the first boot, per-overlay via qcow2 whiteout); BIB's entries lack the
# reference, so the patch re-adds it. The patch strips the generic root
# kargs, adds the platform id, and arms the marker — stock-identical
# semantics per worker overlay.
layered_image_bib_platform_karg: "ignition.platform.id=qemu"
layered_image_bib_ignition_firstboot_marker: "ignition.firstboot"
# Stamp written after the BIB disk is patched; the build is skipped only
# when BOTH the disk and the stamp exist (an interrupted build re-patches).
layered_image_bib_stamp_name: "patched.stamp"
# nbd device for the in-place BLS patch (host kernel module nbd required).
layered_image_bib_nbd_device: 3
layered_image_bib_nbd_settle_retries: 10
layered_image_bib_nbd_settle_delay: 3
