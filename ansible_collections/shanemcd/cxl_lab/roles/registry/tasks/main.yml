---
# registry: node-reachable image registry (runbook §7) — registry:2 container
# bound to the lab gateway so nodes pull over plain HTTP (cluster trusts it
# via the image.config insecureRegistries patch applied by layered_image).

- name: Ensure registry data directory
  ansible.builtin.file:
    path: "{{ vm_registry_data_dir }}"
    state: directory
    mode: "0755"

- name: Run lab registry container
  containers.podman.podman_container:
    name: "{{ registry_container_name }}"
    image: "{{ registry_image }}"
    state: started
    publish:
      - "{{ lab_gateway_ip }}:{{ registry_port }}:{{ registry_port }}"
    volumes:
      - "{{ vm_registry_data_dir }}:/var/lib/registry:Z"

- name: Read lab registry container state
  containers.podman.podman_container_info:
    name: "{{ registry_container_name }}"
  register: registry_container_state

- name: Assert lab registry container is running
  ansible.builtin.assert:
    that:
      - registry_container_state.containers | length == 1
      - registry_container_state.containers[0].State.Running
    fail_msg: >-
      {{ registry_container_name }} is not running — inspect
      `podman logs {{ registry_container_name }}`.

- name: Probe the registry v2 API
  ansible.builtin.uri:
    url: "{{ registry_v2_probe_url }}"
    status_code: 200
  register: registry_v2_probe
  changed_when: false

- name: Assert registry API answers
  ansible.builtin.assert:
    that:
      - registry_v2_probe.status == 200
    fail_msg: >-
      Registry v2 API unreachable at {{ registry_v2_probe_url }}.

- name: Registry summary
  ansible.builtin.debug:
    msg: >-
      registry OK — {{ registry_host }} ({{ registry_image }}),
      data under {{ vm_registry_data_dir }}.
