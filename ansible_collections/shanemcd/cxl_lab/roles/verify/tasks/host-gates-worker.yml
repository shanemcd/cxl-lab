---
# Per-CXL-worker host gates, included with loop_var: worker. The QEMUs
# run on the HOST under our run scripts — the pidfile --status interface
# is the authoritative liveness check. Host NUMA placement is
# intentionally NOT gated (first-touch placement policy).

- name: Read the QEMU status for {{ worker.name }}
  ansible.builtin.command:
    argv:
      - bash
      - "{{ vm_scripts_dir }}/run-{{ worker.name }}.sh"
      - --status
  register: verify_qemu_status
  failed_when: false
  changed_when: false

- name: Read the QEMU pid for {{ worker.name }}
  ansible.builtin.slurp:
    src: "{{ vm_run_dir }}/{{ worker.name }}.pid"
  register: verify_qemu_pid_raw

- name: Assert the QEMU process runs for {{ worker.name }}
  ansible.builtin.assert:
    that:
      - verify_qemu_status.rc == 0
      - (verify_qemu_pid_raw.content | b64decode | trim | int) > 0
    fail_msg: >-
      {{ worker.name }} QEMU is not running per its pidfile status
      (rc={{ verify_qemu_status.rc }},
      output: {{ verify_qemu_status.stdout | default('') | trim }}).

- name: Collect the host gate evidence for {{ worker.name }}
  ansible.builtin.set_fact:
    verify_host_report: "{{ verify_host_report | default({})
                            | combine({worker.name: {
                                'pid': verify_qemu_pid_raw.content | b64decode | trim,
                                'status': verify_qemu_status.stdout | trim,
                              }}) }}"
