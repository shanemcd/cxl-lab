---
# verify role-scoped knobs. Shared names (region-commit service,
# region name, guest CXL node) live in the topology taxonomy; the evidence dir
# lives in the paths taxonomy. Everything here is read-only probing — all tasks
# report changed=0.
verify_evidence_report_name: "verify-report.txt"

# Kernel signature printed when the region commits on the cxltest kernel
# (CONFIG_CXL_REGION_INVALIDATION_TEST=y bypass path).
verify_dmesg_signature: "Bypassing cpu_cache_invalidate_memregion"

# Bounded touch (TEST-ONLY): anonymous mapping under membind to the
# guest CXL node, exact per-node residency read from numa_maps,
# md5 read-back against the written pattern.
verify_bounded_touch: true
verify_touch_size_mib: 64
# The touch passes when at least this much of the mapping is resident
# on the CXL node — half the mapping size, leaving room for a stray
# page or two landing elsewhere.
verify_touch_min_node1_kib: 32768

# Built-in MachineConfigPools that must be Updated alongside the worker-cxl
# pool (OpenShift-fixed pool names).
verify_builtin_mcp_names:
  - "master"
  - "worker"

# Every pool verification expects: both flows end with a worker-cxl pool —
# the MCO path creates it at 08, the pre-baked path ships it as an
# install-time manifest (the workers fetch its config at first boot so the
# pivot targets the layered image). Role-scoped (not task-scoped) because
# both the read and the assert consume it.
verify_mcp_expected_names: "{{ verify_builtin_mcp_names + [worker_cxl_mcp_name] }}"

# Cluster settle gate: before asserting, verification waits up to this window
# (retries x delay) for every operator and the clusterversion to read
# Available — a freshly converged minimum-spec cluster can flap briefly.
verify_cluster_settle_retries: 40
verify_cluster_settle_delay_seconds: 15
