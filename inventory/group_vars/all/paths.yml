---
# Workspace layout. install_dir holds secrets: 0700 dir / 0600 files,
# enforced by the roles that write there. Everything mutable lives under
# vm_assets_dir.
install_dir: "/root/ocp-install-cxl"
install_bin_dir: "{{ install_dir }}/bin"
vm_assets_dir: "/home/ocp-cxl"
artifacts_dir: "{{ vm_assets_dir }}/artifacts"
artifacts_srpm_dir: "{{ artifacts_dir }}/srpm"
artifacts_kernel_rpms_dir: "{{ artifacts_dir }}/kernel-rpms"
artifacts_downloads_dir: "{{ artifacts_dir }}/downloads"
artifacts_kernel_build_dir: "{{ artifacts_dir }}/kernel-build"
# Stock upstream QEMU builder workspace: tarball staging, build script, and
# the DESTDIR staging tree that is copied to qemu_install_prefix.
qemu_build_dir: "{{ artifacts_dir }}/qemu-build"
layered_image_build_dir: "{{ install_dir }}/layered-image"
vm_registry_data_dir: "{{ vm_assets_dir }}/registry/data"
vm_images_dir: "{{ vm_assets_dir }}/images"
# The master's boot media (bootstrap-in-place live-ISO boot model) — kept
# in the artifacts downloads dir, referenced read-only by the master's run
# script.
rhcos_live_iso_path: "{{ artifacts_downloads_dir }}/{{ rhcos_iso_image_name }}"
# Per-master prepared boot-medium copy (kargs-patched live ISO; the vms and
# teardown roles share the name).
vms_master_iso_name: "{{ masters[0].name }}-install.iso"
# Pre-baked node images (use_prebaked_node_images): bootc-image-builder
# qcow2 output for the CXL workers.
node_image_build_dir: "{{ vm_assets_dir }}/node-images"
# The BIB-produced, ignition-armed qcow2 the workers boot overlays of
# (pre-baked mode). Built by the layered_image role BEFORE the vms role
# runs (see 05_vms.yml); the vms and layered_image roles share this path.
prebaked_node_image_path: "{{ node_image_build_dir }}/qcow2/disk.qcow2"
# Ignition files staged here for fw_cfg delivery — the run scripts pass each
# node's .ign directly via QEMU fw_cfg (no HTTP server involved).
vm_ignition_dir: "{{ vm_assets_dir }}/ignition"
# Region-commit ignition snippet (pre-baked mode): the region_commit role
# renders it (from the same MachineConfig template the MCO path uses) and
# the install_config merge folds it into each CXL worker's first-boot
# ignition. Shared by both roles.
region_commit_ignition_snippet_path: "{{ install_dir }}/region-commit-ignition-snippet.json"
vm_logs_dir: "{{ vm_assets_dir }}/logs"
vm_scripts_dir: "{{ vm_assets_dir }}/scripts"
vm_run_dir: "{{ vm_assets_dir }}/run"

# Installer-fixed ignition output names (shared by install_config, vms, and
# teardown). bootstrap.ign is still emitted by the installer but unused by
# the bootstrap-in-place flow.
ignition_bootstrap_name: "bootstrap.ign"
ignition_master_name: "master.ign"
ignition_worker_name: "worker.ign"

# Stock upstream QEMU installed to a host prefix by the artifacts phase
# (built in a CentOS Stream 10 container so the produced binaries run
# against the host's glibc; no patch, no runtime image). The exists-guard
# keys off the versioned prefix — teardown never removes it, so a
# same-version rebuild skips the build entirely. With qemu_source: auto /
# distro (see topology.yml — experimental) the qemu_builder role instead
# points the lab at the distribution binary below and never touches this
# prefix.
qemu_install_prefix: "/opt/qemu-{{ qemu_version }}"
qemu_binary_path: "{{ qemu_install_prefix }}/bin/qemu-system-x86_64"
qemu_distro_binary_path: "/usr/bin/qemu-system-x86_64"
# Stamp carrying the resolved QEMU binary path when the DISTRO source is
# used (the pinned path is the group-var default, so the stamp only exists
# to override it). Written by the qemu_builder role, consumed by the vms
# role; lives in the scripts dir and dies with the vms teardown layer.
qemu_source_stamp_name: "qemu-binary-path"

# Install-flow state stamps (idempotency guards that must survive re-runs).
# Authoritative registry digest of the layered OS image (layered_image
# writes it from the registry's Docker-Content-Digest; the osImageURL
# MachineConfig build reads it).
layered_image_digest_stamp_path: "{{ install_dir }}/layered-image-digest"

# Verification evidence: 0700 dir, 0600 report — the verify role writes the
# full checklist output here (host_prep ensures the dir).
verification_dir: "{{ install_dir }}/verification"
