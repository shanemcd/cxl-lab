---
# Node topology: single-node OpenShift — 1 schedulable master + N CXL
# workers + M DRAM workers. The worker lists are GENERATED from the counts
# below, so the fleet size is a two-variable change; per-node specs sit at
# the OpenShift-documented minimums. MACs derive as
# {{ mac_base }}:{{ item.mac_suffix }} with mac_suffix the hex of the node's
# ip_suffix; IPs as {{ lab_subnet_prefix }}.{{ item.ip_suffix }}.
#
# Allocation schemes (stable across counts — growing the fleet appends
# without renumbering):
#   master:      ip suffix 11
#   CXL workers: ip suffix 20 + 2*i, pxb-cxl bus 12 + i   (20, 22, 24, ...)
#   DRAM workers: ip suffix 21 + 2*i                      (21, 23, 25, ...)
# host_prep asserts the suffixes stay unique and below the dnsmasq free
# range, and that the CXL bus numbers stay unique and within PCI bounds.
mac_base: "52:54:00:0c:0c"

# Fleet size. The default lab is one CXL worker + one DRAM worker.
cxl_worker_count: 1
dram_worker_count: 1

# Per-node specs — vCPU/RAM at the OpenShift-documented minimum resource
# requirements (master from "Requirements for installing OpenShift on a single
# node" minimum profile: 4 vCPUs, 16 GB RAM; workers from "Minimum resource
# requirements for cluster installation": 2 vCPUs, 8 GB RAM). Guest DISKS are
# lab-tuned below the documented minimums (120 GB master / 100 GB workers):
# the bootstrap-in-place path enforces no disk minimums at install time (only
# the Assisted Installer does), the overlays are sparse qcow2, and the cluster
# is disposable — the trade is long-run headroom (etcd + monitoring growth on
# the master's root LV; expect DiskPressure eventually if left running).
master_vcpu: 4
master_ram: "16G"
master_disk: "100G"
worker_vcpu: 2
worker_ram: "8G"
worker_disk: "40G"

masters:
  - name: "cxl-master-0"
    ip_suffix: 11
    mac_suffix: "{{ '%02x' % 11 }}"
    vcpu: "{{ master_vcpu }}"
    ram: "{{ master_ram }}"
    disk: "{{ master_disk }}"

# Emulated CXL region size per CXL worker (the cxl-type3 volatile memdev —
# the guest NUMA node the region commits onto).
cxl_vmem_size: "4G"

cxl_workers: >-
  {%- set out = [] -%}
  {%- for i in range(cxl_worker_count | int) -%}
  {%- set suffix = 20 + 2*i -%}
  {%- set _ = out.append({'name': 'worker-cxl-%d' % i,
        'ip_suffix': suffix,
        'mac_suffix': '%02x' % suffix,
        'vcpu': worker_vcpu, 'ram': worker_ram, 'disk': worker_disk,
        'vmem_size': cxl_vmem_size, 'cxl_bus_nr': 12 + i}) -%}
  {%- endfor -%}
  {{ out }}

dram_workers: >-
  {%- set out = [] -%}
  {%- for i in range(dram_worker_count | int) -%}
  {%- set suffix = 21 + 2*i -%}
  {%- set _ = out.append({'name': 'worker-dram-%d' % i,
        'ip_suffix': suffix,
        'mac_suffix': '%02x' % suffix,
        'vcpu': worker_vcpu, 'ram': worker_ram, 'disk': worker_disk}) -%}
  {%- endfor -%}
  {{ out }}
# SNO: the single master is schedulable (it carries the ingress and registry
# operators; the default IngressController is pinned to it).
masters_schedulable: true

# Bootstrap-in-place install target: the virtio disk the installer writes the
# master to — interpolated into install-config (bootstrapInPlace.
# installationDisk) and used by the vms role as the installed-vs-live gate
# signal (the installed master's /sysroot lives on this device).
bip_installation_disk: "/dev/vda"

# Pre-baked node images: workers boot bootc-image-builder qcow2s on the
# cxltest kernel from first boot. The three blockers that made
# this path unsupported are fixed: (1) the layered image regenerates its
# initramfs AFTER the rpm-ostree override (the scriptlet-time dracut captured
# rpm-ostree's useradd interceptor wrapper without its .rpmostreesave
# companion, so first-boot ignition user creation died); (2) the BIB disk's
# BLS entries are patched to the stock RHCOS karg shape (BIB writes
# root=UUID=..., which makes the generic root-mount path skip
# ostree-prepare-root — /sysroot then has no top-level /etc and ignition
# cannot create users); (3) the patch re-adds the $ignition_firstboot BLS
# variable reference that BIB drops — the grub 05_ignition.cfg snippet
# expands it from the ignition.firstboot marker (armed per fresh overlay,
# removed by ignition after the first boot); (4) OpenShift's firstboot OS
# check compares each node's booted image ref against its pool's osImageURL —
# the worker-cxl pool's osImageURL MachineConfig ships as an install-time
# manifest carrying the BIB disk's own booted ref (layered_image_local_ref),
# so the check matches, no pivot ever fires, and the workers fetch
# /config/worker-cxl at first boot.

# Host QEMU source: pinned (default) builds the stock upstream QEMU in
# the RHEL 10 builder container. auto / distro use the distribution's
# qemu-system-x86_64 when it carries pxb-cxl / cxl-rp / cxl-type3
# (Fedora's qemu-system-x86-core does) — EXPERIMENTAL: with this lab's
# machine config (q35 + pxb-cxl graph + virtio NIC placement), Fedora 44's
# QEMU 10.2.2 enumerated the graph and configured the guest networking
# (br-ex carried the static IP) but guest<->host frame flow stalled — the
# fleet came up unreachable. Needs investigation before becoming the
# default; the pinned build is a ~2 min one-time cost.
qemu_source: "pinned"

# CXL fixed memory window granularity (QEMU cxl-fmw interleave-granularity, KiB).
vmem_interleave_granularity: 256

# Install-config cluster shape: workers join post-install via ignition + CSR
# approval (compute.replicas stays 0 regardless of the worker lists above).
upi_compute_replicas: 0
cluster_fips: false

# Ignition must be consumed within this window of generation (the machine
# config server certificate validity bounds the useful life of the config).
ignition_fresh_window_hours: 12

# Host NUMA: intentionally NOT handled — no detection, no pinning, no
# per-node assertions. Guest RAM is placed by the kernel's default
# first-touch policy.

# Run-script interface (host QEMU processes): the --validate parse check
# pause, and the tap prefix (Linux ifnames cap at 15 chars — the vms role
# asserts t-<name> fits).
vms_validate_timeout: 10
vm_tap_prefix: "t-"
# --stop force window: SIGTERM to the pidfile QEMU pid, then SIGKILL after this
# many seconds (used when a wedged guest ignores ssh poweroff; always
# pidfile-targeted, never pkill).
vm_stop_wait_seconds: 30

# The CXL worker pool: node label + MachineConfigPool name + the
# MachineConfig role selector (shared by install_config, vms, region_commit,
# verify, and teardown — role defaults never cross roles).
worker_cxl_role_label: "worker-cxl"
worker_cxl_mcp_name: "worker-cxl"

# Region-commit unit + sysfs region name (shared by region_commit and verify
# — role defaults never cross roles).
region_commit_service_name: "cxl-region-commit.service"
region_commit_region_name: "region0"
# Install-time MachineConfig object name for the layered osImageURL
# (shared by install_config, verify, and teardown).
worker_cxl_osimage_mc_name: "50-cxltest-os-image"

# Guest CXL NUMA node (SRAT shape): the QEMU graphs give every CXL worker a
# CPU-less guest node that carries the CXL kmem (pxb-cxl numa_node + the
# empty -numa node); verify asserts dax0.0/target_node and the node's
# meminfo against it.
cxl_guest_numa_node: 1

# Fleet-wide VM lifecycle knobs (shared by region_commit recovery, teardown,
# and the ops roles — role defaults never cross roles): how long to wait for a
# guest QEMU to exit after poweroff (per the run scripts' --status rc 3), the
# node-Ready wait after a (re)start, and the poll for the region-commit
# oneshot to go active after boot.
vm_stop_wait_retries: 60
vm_stop_wait_delay: 5
vm_node_ready_timeout_minutes: 15
vm_service_wait_retries: 20
vm_service_wait_delay: 15

# The master's installed first boot must fully converge the bootstrap-in-place
# control plane before its Machine Config Server answers (the workers fetch
# ignition from it). Observed convergence: ~25 minutes of operator rollout
# after the install-to-disk reboot — this budget keeps a healthy margin over
# that while bounding a genuinely stuck bootstrap.
vm_mcs_wait_retries: 240
vm_mcs_wait_delay: 15
