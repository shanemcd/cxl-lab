---
# Secret locations — PATHS ONLY. Contents are never stored in variables,
# never logged; tasks that touch them run with no_log and enforce 0600.
pull_secret_path: "{{ lab_user_home }}/pull-secret.txt"
# CI registry pull secret (registry.ci.openshift.org) for nightly payload
# access — required by the nightly profiles in versions.yml; set to "" for
# GA-only installs. When set, host_prep renders the merged install secret
# (base + CI, auth for quay.io AND registry.ci) to install_pull_secret_path.
ci_pull_secret_path: "{{ lab_user_home }}/ci-pull-secret.json"
# The effective secret for install-config pullSecret and release-payload
# operations: the merged secret when a CI secret is configured AND the
# active profile installs from registry.ci.openshift.org (nightly); the
# base pull secret otherwise (GA installs never carry CI auth). Rendered/
# validated by host_prep; 0600, no_log.
install_pull_secret_path: >-
  {{ (ci_pull_secret_path | default('') | length > 0 and ocp_artifact_profile == 'nightly')
     | ternary(install_dir ~ '/pull-secret-merged.json', pull_secret_path) }}
# Dedicated keypair generated for the guest core user (install-config
# sshKey — kept separate from any personal host keys).
install_ssh_key_path: "{{ install_dir }}/ssh/core_id_ed25519"
install_ssh_pubkey_path: "{{ install_dir }}/ssh/core_id_ed25519.pub"
kubeconfig_path: "{{ install_dir }}/auth/kubeconfig"
