---
# Secret locations — PATHS ONLY. Contents are never stored in variables,
# never logged; tasks that touch them run with no_log and enforce 0600.
pull_secret_path: "/root/pull-secret.txt"
# Dedicated keypair generated for the guest core user (install-config
# sshKey — kept separate from any personal host keys).
install_ssh_key_path: "{{ install_dir }}/ssh/core_id_ed25519"
install_ssh_pubkey_path: "{{ install_dir }}/ssh/core_id_ed25519.pub"
kubeconfig_path: "{{ install_dir }}/auth/kubeconfig"
