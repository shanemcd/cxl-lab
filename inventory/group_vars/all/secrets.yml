---
# Secret locations — PATHS ONLY (plan §4 gate 4). Contents are never stored in
# variables, never logged; tasks that touch them run with no_log and enforce 0600.
pull_secret_path: "/root/pull-secret.txt"
# Dedicated keypair generated for the guest core user (install-config sshKey;
# experiment log "generated a dedicated id_ed25519 keypair for the core user").
install_ssh_key_path: "{{ install_dir }}/ssh/core_id_ed25519"
install_ssh_pubkey_path: "{{ install_dir }}/ssh/core_id_ed25519.pub"
kubeconfig_path: "{{ install_dir }}/auth/kubeconfig"
kubeadmin_password_path: "{{ install_dir }}/auth/kubeadmin-password"
